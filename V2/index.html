<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-layout="three">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KiconCreator · 图标王制作器 </title><title>KiconCreator · 图标王制作器 </title>

<!-- ============================================================
ch  - 2.04 按模块拆分为 css/（3 个文件）与 js/（18 个模块），便于 AI Agent 增量编辑；逻辑零改动，详见 ARCHITECTURE.md
  - 2.03 基于deepseek网页对话继续开发
-->
<!-- 样式：加载顺序即层叠优先级，勿调整 -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">K</div>
    <div class="brand-text">
      <h1>KiconCreator <span class="ver">V2.04</span></h1>
      <p>图标王制作器 · 零安装 · 纯浏览器运行 · by Kong</p>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="segmented icon-only">
      <button title="撤销 Ctrl+Z" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-4"/></svg></button>
      <button title="重做 Ctrl+Y" id="redoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h4"/></svg></button>
    </div>
    <button class="linkage-btn partial" id="linkageBtn"><span class="dot"></span><span class="lbl">参数联动：部分</span></button>
    <div class="segmented" id="themeSwitch">
      <button data-theme="light" class="active">明亮</button>
      <button data-theme="retro">复古</button>
      <button data-theme="dark">暗黑</button>
    </div>
  </div>
</header>

<div class="merge-tabs" id="mergeTabs">
  <button class="merge-tab active" data-tab="mid">内容参数</button>
  <button class="merge-tab" data-tab="right">背景参数</button>
</div>

<main class="layout" data-mode="three">
  <section class="col col-left">
    <section class="module module-preview">
      <div class="module-head">
        <span class="mh-title">预览</span>
        <span class="mh-spacer"></span>
        <select class="mini-select" id="guideSelect">
          <option value="none">无辅助线</option>
          <option value="cross">十字</option>
          <option value="star">米字</option>
          <option value="thirds">均分井字</option>
        </select>
        <button class="btn icon" id="enlargeBtn" title="放大预览">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
        </button>
      </div>
      <div class="module-body">
        <div class="preview-stage" id="stage">
          <div class="preview-canvas-wrap" id="canvasWrap">
            <canvas id="iconCanvas" width="256" height="256"></canvas>
            <svg class="guides-layer" id="guidesLayer" viewBox="0 0 100 100" preserveAspectRatio="none" data-mode="none">
              <g class="g-guide g-cross"><line x1="50" y1="0" x2="50" y2="100" vector-effect="non-scaling-stroke"/><line x1="0" y1="50" x2="100" y2="50" vector-effect="non-scaling-stroke"/></g>
              <g class="g-guide g-star"><line x1="50" y1="0" x2="50" y2="100" vector-effect="non-scaling-stroke"/><line x1="0" y1="50" x2="100" y2="50" vector-effect="non-scaling-stroke"/><line x1="0" y1="0" x2="100" y2="100" vector-effect="non-scaling-stroke"/><line x1="100" y1="0" x2="0" y2="100" vector-effect="non-scaling-stroke"/></g>
              <g class="g-guide g-thirds"><line x1="33.3" y1="0" x2="33.3" y2="100" vector-effect="non-scaling-stroke"/><line x1="66.7" y1="0" x2="66.7" y2="100" vector-effect="non-scaling-stroke"/><line x1="0" y1="33.3" x2="100" y2="33.3" vector-effect="non-scaling-stroke"/><line x1="0" y1="66.7" x2="100" y2="66.7" vector-effect="non-scaling-stroke"/></g>
            </svg>
            <div class="safe-box" id="safeBox"></div>
          </div>
        </div>
        <div class="preview-foot">
          <span class="k" id="sizeTag">256 × 256</span>
          <label class="mini-check"><input type="checkbox" id="safeChk" checked> 安全边距</label>
          <input class="num" id="safePct" value="10" style="width:36px;flex:0 0 36px;height:20px">
          <span>%</span>
          <span class="hint-text">滚轮缩放 · 双击复位 / 模态预览</span>
        </div>
      </div>
    </section>
    <div class="preview-placeholder" aria-hidden="true"></div>

    <section class="module" id="modulePreset">
      <div class="module-head"><span class="mh-title">预设、历史和下载</span></div>
      <div class="module-body">
        <div class="tab-groups" data-module="preset"></div>
      </div>
    </section>
  </section>

  <section class="col col-mid">
    <section class="module">
      <div class="module-head"><span class="mh-title">多行设置</span></div>
      <div class="module-body">
        <div class="param">
          <span class="pname">行数</span>
          <div class="pctrl"><div class="pill-row" id="rowCount"></div></div>
        </div>
        <div class="param inline-chips">
          <span class="pname">排版模式</span>
          <div class="pctrl"><div class="chip-row" id="layoutChips"></div></div>
        </div>
        <div class="param inline-chips" id="layerParam">
          <span class="pname">多行排列层次</span>
          <div class="pctrl">
            <div class="chip-row">
              <button class="chip active">1 行 → 9 行</button>
              <button class="chip">9 行 → 1 行</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="module">
      <div class="module-head">
        <span class="mh-title">内容</span>
        <span class="mh-sub" id="contentNote">行 1 · 文本</span>
        <span class="mh-spacer"></span>
        <button class="btn ghost sm" id="copyStyleBtn">复制样式</button>
        <button class="btn ghost sm" id="pasteStyleBtn">粘贴样式</button>
      </div>
      <div class="module-body">
        <div class="vtab-group">
          <div class="vtab-list" id="contentTabs"></div>
          <div class="vtab-body" id="contentBody"></div>
        </div>
      </div>
    </section>

    <section class="module" id="moduleStyle">
      <div class="module-head">
        <span class="mh-title">样式</span>
        <span class="mh-sub" id="styleSub">行 1 · 文本 · “K”</span>
        <span class="mh-spacer"></span>
        <button class="btn ghost sm" id="styleReset">重置</button>
      </div>
      <div class="module-body">
        <div class="tab-groups" data-module="style"></div>
      </div>
    </section>
  </section>

  <section class="col col-right">
    <section class="module" id="moduleShape">
      <div class="module-head"><span class="mh-title">形状与外框</span></div>
      <div class="module-body">
        <div class="tab-groups" data-module="shape"></div>
      </div>
    </section>

    <section class="module" id="moduleFill">
      <div class="module-head"><span class="mh-title">填充数量和布局</span></div>
      <div class="module-body">
        <div class="param inline-chips" style="padding-top:0">
          <span class="pname">填充数量</span>
          <div class="pctrl">
            <div class="chip-row" id="fillCount">
              <button class="chip">单色</button>
              <button class="chip active">二色</button>
              <button class="chip">三色</button>
              <button class="chip">四色</button>
              <button class="chip">五色</button>
              <button class="chip">六色</button>
            </div>
          </div>
        </div>
        <div class="tab-groups" data-module="fill" style="margin-top:10px"></div>
      </div>
    </section>

    <section class="module">
      <div class="module-head">
        <span class="mh-title">内部填充</span>
        <span class="mh-spacer"></span>
        <span class="mh-sub" id="fillSub">共 2 个色块</span>
      </div>
      <div class="module-body">
        <div class="fill-group">
          <div class="fill-list" id="fillList"></div>
          <div class="fill-body" id="fillBody2"></div>
        </div>
      </div>
    </section>
  </section>
</main>

<div class="toast" id="toast"></div>

<div class="modal" id="viewerModal">
  <div class="modal-box">
    <div class="modal-head">
      <span>1:1 模态预览</span>
      <span style="font-size:10.5px;color:var(--muted);font-weight:500" id="modalInfo">256 × 256</span>
      <span class="mh-spacer" style="flex:1"></span>
      <button class="btn icon" id="viewerClose" title="关闭 (ESC)">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <canvas id="viewerCanvas" width="256" height="256"></canvas>
    </div>
  </div>
</div>

<!-- ============================================================
     JS 模块：顺序即依赖顺序，禁止调整。
     详意见同目录 ARCHITECTURE.md 的「模块加载顺序与依赖」一节。
     ============================================================ -->
<script src="js/state.js"></script>        <!-- 1. 全局状态（必须最先） -->
<script src="js/utils.js"></script>        <!-- 2. 工具函数 -->
<script src="js/layout.js"></script>       <!-- 3. 响应式布局引擎 + 统一刷新 -->
<script src="js/builders.js"></script>     <!-- 4. 参数行模板 + 颜色建议数据 -->
<script src="js/panes.js"></script>        <!-- 5. 各 pane HTML 生成器 -->
<script src="js/tabs.js"></script>         <!-- 6. 模块 tab 框架（动态展开） -->
<script src="js/interactions.js"></script> <!-- 7. pane 内交互绑定 -->
<script src="js/linkage.js"></script>      <!-- 8. 参数联动核心 -->
<script src="js/history.js"></script>      <!-- 9. 撤销/重做 + 快照/恢复 -->
<script src="js/exports.js"></script>      <!-- 10. 真实导出 + 下载 pane -->
<script src="js/presets.js"></script>      <!-- 11. 预设 + 历史/预设列表渲染 -->
<script src="js/canvas.js"></script>       <!-- 12. 画布渲染 -->
<script src="js/content.js"></script>      <!-- 13. 内容行渲染 -->
<script src="js/fills.js"></script>        <!-- 14. 内部填充渲染 -->
<script src="js/theme.js"></script>        <!-- 15. 主题/合并标签绑定 -->
<script src="js/topbar.js"></script>       <!-- 16. 顶栏按钮绑定 -->
<script src="js/preview.js"></script>      <!-- 17. 预览交互绑定 -->
<script src="js/main.js"></script>         <!-- 18. 入口 init()（必须最后） -->

</body>
</html>
