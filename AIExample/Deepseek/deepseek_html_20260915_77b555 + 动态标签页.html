<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-layout="three">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KiconCreator · 图标王制作器 V2.02</title>
<style>
/* ================= 主题变量 ================= */
:root{
  --radius:12px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 22px rgba(16,24,40,.06);
  --shadow-lg:0 12px 34px rgba(16,24,40,.12);
  --topbar-h: 54px;
  --merge-tabs-h: 44px;
  --tab-group-gap: 8px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html[data-theme="light"]{
  --bg:#eef1f7; --panel:#ffffff; --panel-2:#f8fafd; --field:#f4f6fb;
  --border:#e3e8f1; --border-strong:#d3dae7; --text:#1d2333; --muted:#7c8698;
  --accent:#4d6ef5; --accent-2:#7c5cff; --accent-soft:#eef2ff;
  --tab-inactive:#f4f6fb;
  --ok:#2fbf71; --warn:#e0603a; --err:#f04a4a;
  --checker-a:#ffffff; --checker-b:#e8ecf3;
}
html[data-theme="retro"]{
  --bg:#eadfc2; --panel:#fdf7e6; --panel-2:#f9f1da; --field:#f3e7c9;
  --border:#dcc99b; --border-strong:#c9b183; --text:#4a3a1c; --muted:#8d7a52;
  --accent:#c07a1d; --accent-2:#a1601a; --accent-soft:#f6e6c1;
  --tab-inactive:#f3e7c9;
  --ok:#3f8f4f; --warn:#b3491f; --err:#c04a2a;
  --checker-a:#fdf7e6; --checker-b:#e6d8b4;
}
html[data-theme="dark"]{
  --bg:#0e1015; --panel:#171a22; --panel-2:#1c1f29; --field:#1f2330;
  --border:#2a2f3c; --border-strong:#3a4152; --text:#e7eaf3; --muted:#8b93a7;
  --accent:#6c8cff; --accent-2:#9b7cff; --accent-soft:#1e2438;
  --tab-inactive:#1f2330;
  --ok:#3ddc84; --warn:#ff7a59; --err:#ff5f5f;
  --checker-a:#20242e; --checker-b:#171a22;
}
/* ================= 基础 ================= */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;
  font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 380px at 12% -6%, color-mix(in srgb,var(--accent) 9%, transparent), transparent 70%),
    radial-gradient(760px 340px at 92% 4%, color-mix(in srgb,var(--accent-2) 8%, transparent), transparent 70%);
  background-attachment:fixed;transition:background .25s,color .25s;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit}
input,select{font-family:inherit}
.hidden{display:none !important}

/* ================= 顶栏 ================= */
.topbar{
  z-index:60;display:flex;align-items:center;gap:14px;padding:9px 18px;
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-weight:800;font-size:17px;display:grid;place-items:center;
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 42%, transparent);letter-spacing:-.5px;
}
.brand-text h1{margin:0;font-size:14.5px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:7px;line-height:1.2}
.ver{font-size:10px;font-weight:600;padding:1.5px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 26%, transparent)}
.brand-text p{margin:2px 0 0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.segmented{display:inline-flex;background:var(--field);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.segmented button{border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;transition:.15s;line-height:1}
.segmented button:hover{color:var(--text)}
.segmented button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.segmented.icon-only button{padding:6px 8px;display:grid;place-items:center}
.segmented.icon-only svg{width:15px;height:15px}
.linkage-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--field);color:var(--muted);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:9px;cursor:pointer;transition:.15s}
.linkage-btn:hover{border-color:var(--accent);color:var(--accent)}
.linkage-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 3px color-mix(in srgb,var(--muted) 18%,transparent)}
.linkage-btn.partial .dot{background:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.18)}
.linkage-btn.all .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.linkage-btn.none .dot{background:var(--muted)}

/* ================= 布局 ================= */
.layout{min-height:0;min-width:0;overflow:hidden;display:grid;gap:14px;padding:14px 18px}
html[data-layout="three"] .layout{grid-template-columns:repeat(3, minmax(0, 1fr));grid-template-rows:minmax(0, 1fr)}
html[data-layout="two"] .layout{grid-template-columns:minmax(240px, 1fr) minmax(280px, 1.5fr);grid-template-rows:minmax(0, 1fr)}
html[data-layout="one"] .layout{display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:10px 12px;gap:12px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
html[data-layout="three"] .col,
html[data-layout="two"] .col{overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable}
html[data-layout="one"] .col{display:contents}
html[data-layout="two"] .col-left{grid-column:1;grid-row:1}
html[data-layout="two"] .col-mid{grid-column:2;grid-row:1;padding-top:var(--merge-tabs-h)}
html[data-layout="two"] .col-right{grid-column:2;grid-row:1;padding-top:var(--merge-tabs-h)}
html[data-layout="two"] .col-mid:not(.active),
html[data-layout="two"] .col-right:not(.active){display:none}

.merge-tabs{
  display:none;position:fixed;z-index:50;gap:4px;padding:4px;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);
}
html[data-layout="two"] .merge-tabs{display:flex}
.merge-tab{flex:1;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;transition:.15s}
.merge-tab:hover{color:var(--text)}
.merge-tab.active{background:var(--accent-soft);color:var(--accent);box-shadow:var(--shadow)}

/* ================= 模块 ================= */
.module{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:0;flex:0 0 auto}
.module-head{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12.5px;font-weight:700;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--panel-2),var(--panel));min-height:38px}
.mh-title{letter-spacing:.2px}
.mh-sub{font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-spacer{flex:1}
.module-body{padding:11px 12px 13px}

/* 按钮 */
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ghost{background:var(--field);color:var(--muted)}
.btn.ghost:hover{color:var(--accent);background:var(--accent-soft)}
.btn.icon{padding:5px 7px;display:grid;place-items:center}
.btn.icon svg{width:14px;height:14px}

/* ================= 预览 ================= */
.module-preview{min-height:160px;display:flex;flex-direction:column;flex:0 0 auto;transition:height .18s ease-out}
.module-preview .module-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px}
.preview-stage{
  position:relative;display:flex;align-items:center;justify-content:center;
  padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);
  min-height:80px;flex:1 1 auto;background-color:var(--checker-a);
  background-image:
    linear-gradient(45deg,var(--checker-b) 25%,transparent 25%),
    linear-gradient(-45deg,var(--checker-b) 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,var(--checker-b) 75%),
    linear-gradient(-45deg,transparent 75%,var(--checker-b) 75%);
  background-size:18px 18px;
  background-position:0 0,0 9px,9px -9px,-9px 0;
  overflow:hidden;
}
.preview-canvas-wrap{display:flex;align-items:center;justify-content:center;position:relative;max-width:100%;max-height:100%;transition:transform .12s ease-out;transform-origin:center center}
#iconCanvas{display:block;width:auto;height:auto;max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 10px 26px rgba(18,26,48,.20), 0 2px 6px rgba(18,26,48,.10);cursor:zoom-in}
.safe-box{position:absolute;pointer-events:none;border:1px dashed color-mix(in srgb,var(--muted) 70%, transparent);display:none;border-radius:4px}
.safe-box.show{display:block}
.guides-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
.guides-layer.show{display:block}
.guides-layer line{stroke:color-mix(in srgb,var(--muted) 55%, transparent);stroke-width:1}
.g-guide{display:none}
.guides-layer[data-mode="cross"] .g-cross,
.guides-layer[data-mode="star"] .g-star,
.guides-layer[data-mode="thirds"] .g-thirds{display:block}
.preview-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);flex:0 0 auto}
.preview-foot .k{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text);background:var(--field);border:1px solid var(--border);padding:2px 7px;border-radius:6px}
.hint-text{margin-left:auto}
html[data-layout="three"] .module-preview .module-head,
html[data-layout="two"] .module-preview .module-head{padding:6px 10px;min-height:34px}
html[data-layout="three"] .module-preview .module-body,
html[data-layout="two"] .module-preview .module-body{padding:8px 10px 10px;gap:5px}
html[data-layout="three"] .module-preview .preview-stage,
html[data-layout="two"] .module-preview .preview-stage{padding:8px}
html[data-layout="three"] .module-preview .hint-text,
html[data-layout="two"] .module-preview .hint-text{display:none}
.preview-placeholder{display:none;flex:0 0 auto}
body.preview-float .module-preview{position:fixed;top:var(--topbar-h);z-index:45;margin:0;border-radius:var(--radius);box-shadow:0 16px 38px rgba(16,24,40,.22), 0 4px 10px rgba(16,24,40,.10)}
body.preview-float .preview-placeholder{display:block;height:var(--preview-placeholder-h, 220px)}

/* ================= 动态标签组 ================= */
.tab-groups{display:flex;flex-direction:column;gap:var(--tab-group-gap);transition:height .15s ease-out}
.tab-group{display:flex;flex-direction:column;min-width:0}
.tab-group .tabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 2px;position:relative;z-index:1}
.tab-group .tab{
  border:1px solid var(--border);border-bottom:none;
  background:var(--tab-inactive);color:var(--muted);
  border-radius:9px 9px 0 0;padding:6px 13px;
  font-size:11.5px;font-weight:600;cursor:pointer;
  position:relative;top:1px;transition:.15s;
  display:inline-flex;align-items:center;gap:5px;
}
.tab-group .tab:hover{color:var(--text);background:var(--panel-2)}
.tab-group .tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--border)}
.tab-group .tab-body{background:var(--accent-soft);border:1px solid var(--border);border-radius:0 9px 9px 9px;padding:9px 11px;min-height:40px}
.tab-group .pane{display:none}
.tab-group .pane.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.tab-group .tab-body .num,
.tab-group .tab-body .sel,
.tab-group .tab-body .mini-input{background:var(--panel)}
.badge-ok{font-size:9px;color:#fff;background:var(--ok);width:13px;height:13px;border-radius:50%;display:grid;place-items:center;line-height:1;visibility:hidden}
.tab.enabled .badge-ok{visibility:visible}

/* ================= 参数行 ================= */
.param{display:flex;align-items:center;gap:8px;padding:5px 0;min-width:0}
.param>.pname{flex:0 0 72px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.param>.pctrl{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.param.stacked{flex-direction:column;align-items:stretch;gap:6px}
.param.stacked>.pname{flex:none;font-weight:600;color:var(--text);opacity:.85}
.param+.param{border-top:1px dashed color-mix(in srgb,var(--border) 70%,transparent)}
.param.stacked+.param.stacked{border-top:none}
.param.tight>.pname{flex:0 0 auto;padding-right:8px;font-weight:600;color:var(--text);opacity:.85}
.param.inline-chips{align-items:flex-start;padding:6px 0}
.param.inline-chips>.pname{flex:0 0 auto;min-width:42px;padding-right:8px;padding-top:4px;font-weight:600;color:var(--text);opacity:.85}
.param.inline-chips>.pctrl{flex:1;min-width:0;flex-direction:column;align-items:stretch}

input[type=range]{--fill:50%;-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:5px;border-radius:99px;outline:none;cursor:pointer;background:linear-gradient(90deg,var(--accent) var(--fill),var(--border) var(--fill))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2.5px solid var(--accent);box-shadow:0 1px 4px rgba(16,24,40,.22);cursor:pointer;transition:transform .12s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--panel);border:2.5px solid var(--accent);cursor:pointer}
.num{width:48px;flex:0 0 48px;height:24px;text-align:center;background:var(--field);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:11px;font-weight:600;padding:0 3px;font-variant-numeric:tabular-nums;transition:.15s}
.num:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.num.wide{width:62px;flex:0 0 62px}
.num.tiny{width:42px;flex:0 0 42px}
.unit{font-size:10px;color:var(--muted);flex:none;min-width:10px}
@keyframes flashInvalid{0%,100%{background:var(--field);border-color:var(--border)}25%,75%{background:color-mix(in srgb,var(--err) 22%,var(--field));border-color:var(--err)}50%{background:color-mix(in srgb,var(--err) 34%,var(--field));border-color:var(--err)}}
.num.invalid{animation:flashInvalid .6s ease 1}
.chain{flex:0 0 22px;width:22px;height:22px;border-radius:7px;padding:0;border:1px solid var(--border);background:var(--field);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.15s}
.chain svg{width:12px;height:12px}
.chain:hover{color:var(--accent);border-color:var(--accent)}
.chain.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 3px 9px color-mix(in srgb,var(--accent) 34%,transparent)}
.rst{flex:0 0 22px;width:22px;height:22px;border-radius:7px;padding:0;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;line-height:1;cursor:pointer;transition:.15s;display:grid;place-items:center}
.rst:hover{color:var(--accent);background:var(--field);border-color:var(--border)}

.sel,.mini-input{background:var(--field);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:4px 7px;font-size:11px;font-weight:600;cursor:pointer;transition:.15s;min-width:0}
.sel:focus,.mini-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.mini-select{background:var(--field);border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:3px 5px;font-size:10.5px;cursor:pointer;max-width:92px}
.mini-select:focus{outline:none;border-color:var(--accent)}
.mini-check{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.mini-check input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
.check-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text);padding:5px 0;cursor:pointer;user-select:none}
.check-row input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;flex:none}
.check-row .hint{font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}

.pill-row{display:flex;gap:4px;flex-wrap:wrap}
.pill{width:25px;height:25px;border-radius:7px;padding:0;border:1px solid var(--border);background:var(--field);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;transition:.15s;display:grid;place-items:center}
.pill:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.pill.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 4px 10px color-mix(in srgb,var(--accent) 34%,transparent)}
.chip-row{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--field);color:var(--muted);border-radius:99px;padding:4px 11px;font-size:11px;font-weight:600;cursor:pointer;transition:.15s;line-height:1.3}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 4px 10px color-mix(in srgb,var(--accent) 30%,transparent)}
.divider{height:1px;background:var(--border);margin:10px 0}

.preset-tools{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.preset-grid{display:flex;flex-wrap:wrap;gap:8px}
.preset-item{width:46px;height:46px;border-radius:10px;overflow:hidden;flex:none;border:1px solid var(--border);background:var(--field);cursor:pointer;position:relative;transition:transform .14s,box-shadow .14s,border-color .14s}
.preset-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.preset-item canvas{width:100%;height:100%;display:block}

.history-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
.history-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;border:1px solid var(--border);background:var(--field);cursor:pointer;transition:.15s}
.history-item:hover{border-color:var(--accent);background:var(--accent-soft)}
.history-item canvas{width:26px;height:26px;border-radius:6px;flex:none}
.history-item .hname{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.history-item .hdel{opacity:0;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;transition:.15s}
.history-item:hover .hdel{opacity:1}
.history-item .hdel:hover{color:var(--err)}

.format-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fmt{border:1px solid var(--border);background:var(--field);color:var(--muted);border-radius:9px;padding:9px 3px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s;letter-spacing:.3px}
.fmt:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 14px color-mix(in srgb,var(--accent) 18%,transparent)}
.filename{margin-top:10px;font-size:10px;color:var(--muted);background:var(--field);border:1px dashed var(--border);border-radius:8px;padding:6px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.vtab-group{display:flex;align-items:stretch;gap:0;min-width:0}
.vtab-list{flex:0 0 auto;width:min(46%,200px);min-width:120px;display:flex;flex-direction:column;max-height:400px;overflow-y:auto;overflow-x:hidden;padding-top:1px}
.vtab{display:flex;align-items:center;gap:5px;padding:4px 7px 4px 5px;cursor:pointer;border:1px solid var(--border);border-right:0;border-radius:10px 0 0 10px;background:var(--panel-2);color:var(--muted);margin-bottom:-1px;position:relative;transition:background .18s,color .18s,border-color .18s,box-shadow .18s}
.vtab:last-child{margin-bottom:0}
.vtab:hover{background:color-mix(in srgb, var(--accent) 8%, var(--panel-2));color:var(--text)}
.vtab.active{background:color-mix(in srgb, var(--accent) 16%, var(--panel));color:var(--text);border-color:color-mix(in srgb, var(--accent) 30%, var(--border));box-shadow:inset 4px 0 0 var(--accent);z-index:2}
.rownum{width:16px;height:16px;border-radius:5px;flex:none;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--muted)}
.vtab.active .rownum{background:var(--accent);border-color:transparent;color:#fff}
.mode-mini{display:flex;gap:1px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:1px;flex:none}
.mode-mini button{border:0;background:transparent;color:var(--muted);font-size:9.5px;font-weight:800;padding:2px 4px;border-radius:4px;cursor:pointer;line-height:1.1}
.mode-mini button.on{background:var(--accent);color:#fff}
.vtab-input{flex:1 1 auto;min-width:30px;height:20px;border:1px solid var(--border);background:var(--panel);border-radius:5px;text-align:center;color:var(--text);font-size:10.5px;font-weight:600;padding:0 3px;overflow:hidden;transition:border-color .18s,box-shadow .18s}
.vtab-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 16%,transparent)}
.vtab-input[readonly]{opacity:.75;cursor:default;text-align:left;font-weight:500}
.vtab-body{flex:1;min-width:0;background:color-mix(in srgb, var(--accent) 16%, var(--panel));border:1px solid color-mix(in srgb, var(--accent) 30%, var(--border));border-left:0;border-radius:0 10px 10px 10px;padding:10px 11px;min-height:150px}

.cp-label{font-size:10.5px;color:var(--muted);margin-bottom:8px;font-weight:600}
.cp-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.cp-thumb{width:88px;height:88px;border-radius:10px;border:1px dashed var(--border-strong);background:var(--panel);display:grid;place-items:center;color:var(--muted);font-size:10px;text-align:center;line-height:1.5}
.fa-search{width:100%;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:11px;padding:0 9px;margin-bottom:8px}
.fa-search:focus{outline:none;border-color:var(--accent)}
.fa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px;max-height:140px;overflow-y:auto}
.fa-cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--panel);display:grid;place-items:center;font-size:14px;cursor:pointer;transition:.14s;color:var(--text)}
.fa-cell:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);transform:translateY(-1px)}

.suggest-legend{display:flex;gap:12px;font-size:10px;color:var(--muted);margin:8px 0 4px}
.suggest-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:22px;height:22px;border-radius:7px;cursor:pointer;border:1px solid var(--border-strong);transition:.15s}
.sw:hover{transform:scale(1.15);border-color:var(--accent)}
.sw-pair{display:inline-flex;gap:3px;padding:2px;border-radius:9px;border:1px solid var(--border-strong);cursor:pointer;transition:.15s}
.sw-pair:hover{transform:scale(1.1);border-color:var(--accent)}
.sw-pair .sw{border:0;border-radius:5px;width:18px;height:18px}
.sw-pair .sw:hover{transform:none}

.fill-group{display:flex;gap:9px;align-items:flex-start}
.fill-list{display:flex;flex-direction:column;gap:6px;flex:none}
.fill-swatch{width:32px;height:32px;border-radius:9px;border:1px solid var(--border-strong);cursor:pointer;position:relative;overflow:hidden;padding:0;flex:none;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);transition:.15s}
.fill-swatch:hover{transform:translateY(-1px) scale(1.04)}
.fill-swatch.active{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.fill-body{flex:1;min-width:0;background:var(--accent-soft);border:1px solid var(--border);border-radius:10px;padding:9px 10px}

.footer{display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--panel);padding:8px 18px;border-radius:99px;font-size:12px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal{position:fixed;inset:0;background:rgba(8,10,18,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;place-items:center;z-index:100}
.modal.open{display:grid;animation:fade .18s ease}
.modal-box{background:var(--panel);border-radius:14px;padding:12px;box-shadow:0 24px 60px rgba(0,0,0,.45);max-width:92vw;max-height:92vh;display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-size:12.5px;font-weight:700}
.modal-body{flex:1;min-height:0;overflow:auto;background-color:var(--checker-a);background-image:linear-gradient(45deg,var(--checker-b) 25%,transparent 25%),linear-gradient(-45deg,var(--checker-b) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--checker-b) 75%),linear-gradient(-45deg,transparent 75%,var(--checker-b) 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;border:1px solid var(--border);border-radius:10px;padding:16px;display:grid;place-items:center}
.modal-body:active{cursor:grabbing}
.modal-body canvas{display:block;border-radius:12px;box-shadow:0 10px 26px rgba(18,26,48,.3)}

@media (max-width:520px){
  .format-grid{grid-template-columns:repeat(3,1fr)}
  .linkage-btn span.lbl{display:none}
  .modal-body canvas{width:80vw!important;height:80vw!important}
  .topbar{padding:7px 10px;gap:8px}
  .brand-text p{display:none}
  .layout{padding:8px 10px;gap:8px}
  .module-head{padding:7px 10px;font-size:12px}
  .module-body{padding:9px 10px 11px}
}
</style>

              <g class="g-guide g-star"><line x1="50" y1="0" x2="50" y2="100" vector-effect="non-scaling-stroke"/><line x1="0" y1="50" x2="100" y2="50" vector-effect="non-scaling-stroke"/><line x1="0" y1="0" x2="100" y2="100" vector-effect="non-scaling-stroke"/><line x1="100" y1="0" x2="0" y2="100" vector-effect="non-scaling-stroke"/></g>
              <g class="g-guide g-thirds"><line x1="33.3" y1="0" x2="33.3" y2="100" vector-effect="non-scaling-stroke"/><line x1="66.7" y1="0" x2="66.7" y2="100" vector-effect="non-scaling-stroke"/><line x1="0" y1="33.3" x2="100" y2="33.3" vector-effect="non-scaling-stroke"/><line x1="0" y1="66.7" x2="100" y2="66.7" vector-effect="non-scaling-stroke"/></g>
            </svg>
            <div class="safe-box" id="safeBox"></div>

        <div class="preview-foot">

    <section class="module" id="modulePreset">

  <div class="modal-box">

      <span class="mh-spacer" style="flex:1"></span>

      <canvas id="viewerCanvas" width="256" height="256"></canvas>
    </div>

<script>
/* ============================================================
   工具函数
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const CHAIN_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>
  <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
</svg>`;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1700);
}

function flashInvalid(input, min, max){
  input.classList.add('invalid');
  setTimeout(() => input.classList.remove('invalid'), 620);
  let v = parseFloat(input.value);
  if (isNaN(v)) v = min;
  if (v < min) v = min;
  if (v > max) v = max;
  setTimeout(() => { input.value = v; }, 620);
  return v;
}

/* ============================================================
   顶栏高度测量
   ============================================================ */
function updateTopbarHeight(){
  const tb = $('.topbar');
  if (!tb) return;
  const h = Math.round(tb.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--topbar-h', h + 'px');
}

/* ============================================================
   视口宽度 → 布局模式
   ============================================================ */
function updateLayoutMode(){
  const w = window.innerWidth;
  const h = window.innerHeight;
  const isPhoneLandscape = w > h && h <= 500;
  const isPhonePortrait = h > w && w < 500;

  let mode;
  if (w > 800 || isPhoneLandscape) mode = 'three';
  else if (w < 400 || isPhonePortrait) mode = 'one';
  else mode = 'two';

  document.documentElement.dataset.layout = mode;
  const layoutEl = $('.layout');
  if (layoutEl) layoutEl.dataset.mode = mode;

  if (mode === 'two'){
    const tab = $('.merge-tab.active')?.dataset.tab || 'mid';
    document.querySelector('.col-mid')?.classList.toggle('active', tab === 'mid');
    document.querySelector('.col-right')?.classList.toggle('active', tab === 'right');
  } else {
    document.querySelector('.col-mid')?.classList.remove('active');
    document.querySelector('.col-right')?.classList.remove('active');
  }
}

/* ============================================================
   两栏合并标签栏位置同步
   ============================================================ */
function syncMergeTabs(){
  const mt = $('#mergeTabs');
  if (!mt) return;
  if (document.documentElement.dataset.layout !== 'two'){
    mt.style.removeProperty('left');
    mt.style.removeProperty('top');
    mt.style.removeProperty('width');
    return;
  }
  const col = document.querySelector('.col-mid.active')
           || document.querySelector('.col-right.active')
           || document.querySelector('.col-mid');
  if (!col) return;
  const r = col.getBoundingClientRect();
  const topbarH = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--topbar-h')
  ) || 54;
  mt.style.left = Math.round(r.left) + 'px';
  mt.style.top = Math.round(topbarH + 8) + 'px';
  mt.style.width = Math.round(r.width) + 'px';
}

/* ============================================================
   预览浮动检测
   ============================================================ */
function isScrollable(el){
  if (!el) return false;
  return el.scrollHeight > el.clientHeight + 2;
}

function checkPreviewFloat(){
  const mode = document.documentElement.dataset.layout;
  const scrollEl = mode === 'one' ? $('.layout') : $('.col-left');
  if (!scrollEl) return;

  const hasScroll = isScrollable(scrollEl);
  const was = document.body.classList.contains('preview-float');
  document.body.classList.toggle('preview-float', hasScroll);

  if (hasScroll){
    requestAnimationFrame(syncPreviewLayout);
  } else if (was) {
    const p = $('.module-preview');
    if (p){
      p.style.removeProperty('left');
      p.style.removeProperty('width');
    }
  }
}

function syncPreviewLayout(){
  const preview = $('.module-preview');
  if (!preview) return;
  const mode = document.documentElement.dataset.layout;

  if (mode === 'one'){
    const layout = $('.layout');
    const cs = getComputedStyle(layout);
    const padL = parseFloat(cs.paddingLeft) || 0;
    const padR = parseFloat(cs.paddingRight) || 0;
    const w = Math.max(0, window.innerWidth - padL - padR);
    preview.style.left = padL + 'px';
    preview.style.width = w + 'px';
  } else {
    const colLeft = $('.col-left');
    const r = colLeft.getBoundingClientRect();
    preview.style.left = Math.round(r.left) + 'px';
    preview.style.width = Math.round(r.width) + 'px';
  }

  const h = Math.round(preview.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--preview-placeholder-h', h + 'px');
}

/* ============================================================
   预览高度自适应
   ============================================================ */
function updatePreviewHeight(){
  const preview = $('.module-preview');
  if (!preview) return;
  const mode = document.documentElement.dataset.layout;

  if (mode === 'one'){
    updatePreviewHeightSingle(preview);
    return;
  }
  const rect = preview.getBoundingClientRect();
  const w = rect.width;
  if (w <= 0) return;

  let targetH = w;
  const col = preview.parentElement;
  const colH = col ? col.clientHeight : window.innerHeight;
  const maxAllowed = Math.max(180, colH * 0.9);
  targetH = Math.min(targetH, maxAllowed);
  targetH = Math.max(targetH, 180);
  preview.style.height = Math.round(targetH) + 'px';

  if (document.body.classList.contains('preview-float')){
    document.documentElement.style.setProperty('--preview-placeholder-h', Math.round(targetH) + 'px');
  }
}

function updatePreviewHeightSingle(preview){
  const col = $('.layout');
  if (!col) return;
  const topbarH = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--topbar-h')
  ) || 54;
  const colH = Math.max(col.clientHeight, window.innerHeight - topbarH - 20);
  if (colH <= 0) return;

  const siblings = Array.from(col.children).filter(el =>
    el.classList.contains('module') && !el.classList.contains('module-preview')
  );
  const cs = getComputedStyle(col);
  const gap = parseFloat(cs.rowGap) || parseFloat(cs.gap) || 12;

  let otherH = 0;
  siblings.forEach(m => { otherH += m.getBoundingClientRect().height; });
  if (siblings.length > 0) otherH += (siblings.length - 1) * gap;

  const available = colH - otherH - 20;
  let maxH;
  if (available >= 320) maxH = Math.min(available, colH * 0.55);
  else maxH = colH / 3;
  maxH = Math.max(150, Math.min(maxH, colH * 0.7));
  preview.style.height = Math.round(maxH) + 'px';

  if (document.body.classList.contains('preview-float')){
    document.documentElement.style.setProperty('--preview-placeholder-h', Math.round(maxH) + 'px');
  }
}

/* ============================================================
   标签组动态展开算法（连续切分版本）
   ------------------------------------------------------------
   标签组总是以"连续切分"方式拆分：每个切分点要么切、要么不切。
   n 个标签有 n-1 个间隔，共 2^(n-1) 种方案。

   方案总高 = Σ(组内标签的最大高度) + (组数 - 1) * groupGap

   打分：
     1. 段数多的优先（同时展示更多标签组）
     2. 段数相同时，总高更大的优先（更充分利用空间）
     3. 再相同，切分位置更靠后的优先（mask 数值大）
   ============================================================ */
function computeTabLayout(heights, extraSpace, groupGap = 8){
  const n = heights.length;
  if (n <= 1) return [Array.from({ length: n }, (_, i) => i)];

  const maxH = Math.max(...heights);
  const totalAvail = maxH + Math.max(0, extraSpace);
  const totalMasks = 1 << (n - 1);

  let best = null;
  for (let mask = 0; mask < totalMasks; mask++){
    const groups = [];
    let cur = [0];
    for (let i = 0; i < n - 1; i++){
      if (mask & (1 << i)){
        groups.push(cur);
        cur = [i + 1];
      } else {
        cur.push(i + 1);
      }
    }
    groups.push(cur);

    let total = 0;
    groups.forEach(g => { total += Math.max(...g.map(i => heights[i])); });
    total += (groups.length - 1) * groupGap;

    if (total > totalAvail) continue;

    const candidate = { segCount: groups.length, total, mask, groups };
    if (!best
      || candidate.segCount > best.segCount
      || (candidate.segCount === best.segCount && candidate.total > best.total)
      || (candidate.segCount === best.segCount && candidate.total === best.total && candidate.mask > best.mask)){
      best = candidate;
    }
  }

  if (!best) return [Array.from({ length: n }, (_, i) => i)];
  return best.groups;
}

/* 用隐藏探针测量每个标签独立时的高度 */
function measureTabHeights(tabs, width){
  const w = Math.max(160, Math.round(width) || 280);
  const probe = document.createElement('div');
  probe.style.cssText = `position:absolute;left:-9999px;top:0;width:${w}px;visibility:hidden;pointer-events:none`;
  document.body.appendChild(probe);

  const heights = tabs.map(t => {
    probe.innerHTML = `<div class="tab-group">
      <div class="tabs"><button class="tab active">${escapeHtml(t.label)}</button></div>
      <div class="tab-body"><div class="pane active">${t.contentHTML}</div></div>
    </div>`;
    const el = probe.firstElementChild;
    return el.offsetHeight;
  });

  document.body.removeChild(probe);
  return heights;
}

/* ============================================================
   收集模块 tab 信息
   ============================================================ */
function collectTabModuleInfo(moduleId){
  const container = document.querySelector(`.tab-groups[data-module="${moduleId}"]`);
  if (!container) return null;
  const tabDefs = MODULE_TABS[moduleId];
  if (!tabDefs) return null;

  const tabs = tabDefs.map(t => ({
    id: t.id,
    label: t.label,
    badge: t.badge || '',
    enabled: t.enabled ? t.enabled() : false,
    contentHTML: t.getContent()
  }));

  const width = container.getBoundingClientRect().width || 280;
  const heights = measureTabHeights(tabs, width);
  const maxH = Math.max(...heights);

  const moduleEl = container.closest('.module');

  /* 临时把容器设为 maxH 高，用于测量 module 的非 tab 部分高度 */
  const savedHeight = container.style.height;
  const savedMinH = container.style.minHeight;
  container.style.height = maxH + 'px';
  container.style.minHeight = maxH + 'px';
  void container.offsetHeight;
  const moduleH = moduleEl ? moduleEl.getBoundingClientRect().height : 0;
  const nonTabH = Math.max(0, moduleH - maxH);
  container.style.height = savedHeight;
  container.style.minHeight = savedMinH;
  void container.offsetHeight;

  return { moduleId, container, moduleEl, tabs, heights, maxH, nonTabH };
}

/* ============================================================
   同栏内多模块共享空间分配 + 渲染
   ============================================================ */
function relayoutColumn(col){
  if (!col) return;
  const mode = document.documentElement.dataset.layout;
  const topbarH = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--topbar-h')
  ) || 54;

  let colH;
  if (mode === 'one'){
    colH = Math.max(col.clientHeight, window.innerHeight - topbarH - 20);
  } else {
    colH = col.clientHeight;
  }
  if (colH <= 0) return;

  const cs = getComputedStyle(col);
  const gap = parseFloat(cs.rowGap) || parseFloat(cs.gap) || 14;

  /* 收集本栏内含 tab-groups 的模块信息 */
  const infos = [];
  col.querySelectorAll('.module').forEach(m => {
    const tg = m.querySelector('.tab-groups');
    if (tg && MODULE_TABS[tg.dataset.module]){
      const info = collectTabModuleInfo(tg.dataset.module);
      if (info) infos.push(info);
    }
  });
  if (infos.length === 0) return;

  /* 计算本栏内其他模块（非 tab 模块）的总高度 */
  const tabModuleEls = infos.map(i => i.moduleEl);
  let otherH = 0;
  let otherCount = 0;
  Array.from(col.children).forEach(child => {
    if (child.classList && child.classList.contains('module') && !tabModuleEls.includes(child)){
      otherH += child.getBoundingClientRect().height;
      otherCount++;
    }
  });

  /* 计算基线高度（所有 tab 模块都不展开） */
  let baseH = 0;
  infos.forEach(i => { baseH += i.nonTabH + i.maxH; });

  const totalModules = infos.length + otherCount;
  const totalGaps = Math.max(0, totalModules - 1) * gap;
  const usedH = otherH + baseH + totalGaps;
  let remain = Math.max(0, colH - usedH);

  /* 按顺序分配额外空间给每个模块 */
  infos.forEach(info => {
    const groups = computeTabLayout(info.heights, remain);
    info.groups = groups;

    /* 计算本模块实际占用的高度 */
    let usedTabH = 0;
    groups.forEach(g => {
      if (g.length === 1) usedTabH += info.heights[g[0]];
      else usedTabH += Math.max(...g.map(i => info.heights[i]));
    });
    if (groups.length > 1) usedTabH += (groups.length - 1) * 8;

    const actualExtra = Math.max(0, usedTabH - info.maxH);
    info.actualUsedTabH = usedTabH;
    remain = Math.max(0, remain - actualExtra);
  });

  /* 渲染 */
  infos.forEach(info => {
    renderTabGroupsFromGroups(info.moduleId, info.container, info.tabs, info.groups);
  });
}

function relayoutAllModules(){
  const mode = document.documentElement.dataset.layout;
  const cols = [];
  if (mode === 'one'){
    const layout = $('.layout');
    if (layout) cols.push(layout);
  } else if (mode === 'two'){
    cols.push(document.querySelector('.col-left'));
    const active = document.querySelector('.col-mid.active') || document.querySelector('.col-right.active');
    if (active) cols.push(active);
  } else {
    ['col-left', 'col-mid', 'col-right'].forEach(cls => {
      const c = document.querySelector('.' + cls);
      if (c) cols.push(c);
    });
  }
  cols.forEach(col => { if (col) relayoutColumn(col); });
}

/* ============================================================
   渲染一个模块的标签组
   ============================================================ */
function renderTabGroupsFromGroups(moduleId, container, tabs, groups){
  const activeId = activeTabByModule[moduleId] || tabs[0].id;

  container.innerHTML = groups.map(group => {
    const groupTabIds = group.map(i => tabs[i].id);
    const hasActive = groupTabIds.includes(activeId);
    const groupActiveId = hasActive ? activeId : groupTabIds[0];

    const tabsHTML = group.map(i => {
      const t = tabs[i];
      const isActive = t.id === groupActiveId;
      return `<button class="tab ${isActive ? 'active' : ''} ${t.enabled ? 'enabled' : ''}" data-tab="${t.id}">
        ${escapeHtml(t.label)} ${t.badge ? `<span class="badge-ok">${t.badge}</span>` : ''}
      </button>`;
    }).join('');

    const panesHTML = group.map(i => {
      const t = tabs[i];
      const isActive = t.id === groupActiveId;
      return `<div class="pane ${isActive ? 'active' : ''}" data-pane="${t.id}">${t.contentHTML}</div>`;
    }).join('');

    return `<div class="tab-group" data-group="${groupTabIds.join(',')}">
      <div class="tabs">${tabsHTML}</div>
      <div class="tab-body">${panesHTML}</div>
    </div>`;
  }).join('');

  /* 标签点击切换 */
  container.querySelectorAll('.tab-group').forEach(groupEl => {
    groupEl.querySelectorAll('.tab').forEach(tabEl => {
      tabEl.addEventListener('click', () => {
        const tabId = tabEl.dataset.tab;
        activeTabByModule[moduleId] = tabId;
        groupEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tabEl));
        groupEl.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.dataset.pane === tabId));
      });
    });
  });

  /* 重新绑定 pane 内交互 */
  bindPaneInteractions(moduleId, container);

  /* preset 模块需要重渲染预设/历史/下载内部 */
  if (moduleId === 'preset'){
    renderPresets();
    renderHistory();
    bindDownloadPaneInteractions();
  }
}

/* ============================================================
   pane 内交互绑定
   ============================================================ */
function bindPaneInteractions(moduleId, container){
  /* 滑块 */
  container.querySelectorAll('input[type=range]').forEach(r => {
    const row = r.closest('.param');
    const min = +r.min || 0;
    const max = +r.max || 100;
    const upd = () => {
      const v = +r.value;
      r.style.setProperty('--fill', (((v - min) / (max - min)) * 100).toFixed(1) + '%');
      const num = row?.querySelector('.num');
      if (num && document.activeElement !== num) num.value = v;
    };
    upd();
    r.addEventListener('input', upd);

    const num = row?.querySelector('.num');
    if (num){
      num.addEventListener('change', () => {
        const v = parseFloat(num.value);
        if (isNaN(v) || v < min || v > max){
          const fixed = flashInvalid(num, min, max);
          setTimeout(() => { r.value = fixed; upd(); }, 620);
          return;
        }
        r.value = v; upd();
      });
      num.addEventListener('blur', () => {
        const v = parseFloat(num.value);
        if (isNaN(v) || v < min || v > max){
          const fixed = flashInvalid(num, min, max);
          setTimeout(() => { r.value = fixed; upd(); }, 620);
        }
      });
    }

    const rst = row?.querySelector('.rst');
    if (rst) rst.addEventListener('click', () => {
      const def = row.dataset.default;
      if (def !== undefined){
        r.value = def;
        const n = row.querySelector('.num');
        if (n) n.value = def;
        upd();
      }
    });
  });

  /* chip 单选 */
  container.querySelectorAll('.chip-row').forEach(row => {
    if (row.closest('[data-group="shape"]')) return;
    if (row.closest('#edgeShapeRow')) return;
    row.addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      $$('.chip', row).forEach(c => c.classList.toggle('active', c === chip));
    });
  });

  /* 联动链条 */
  container.querySelectorAll('.chain').forEach(ch => {
    ch.addEventListener('click', () => ch.classList.toggle('on'));
  });

  /* 颜色建议 */
  container.querySelectorAll('.sw[data-c]').forEach(sw => {
    sw.addEventListener('click', () => toast('已应用建议颜色 ' + sw.dataset.c));
  });
  container.querySelectorAll('.sw-pair').forEach(pair => {
    pair.addEventListener('click', () => toast(`已应用渐变：${pair.dataset.c1} → ${pair.dataset.c2}`));
  });

  /* 阴影启用 → 标签绿勾 */
  const sh = container.querySelector('#shadowEnable');
  if (sh) sh.addEventListener('change', () => renderStyle());

  /* 边框、形状阴影启用 */
  const be = container.querySelector('#borderEnable');
  if (be) be.addEventListener('change', () => rerenderModule('shape'));
  const fs = container.querySelector('#fshadowEnable');
  if (fs) fs.addEventListener('change', () => rerenderModule('shape'));

  /* 颜色模式切换 */
  const seg = container.querySelector('#colorModeSeg');
  if (seg){
    seg.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const newMode = b.dataset.cmode;
      if (newMode === currentColorMode) return;
      currentColorMode = newMode;
      renderStyle();
    });
  }

  /* 边界形状切换 */
  const edgeRow = container.querySelector('#edgeShapeRow');
  if (edgeRow){
    edgeRow.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        currentEdgeShape = chip.dataset.shape;
        edgeRow.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
        const wrap = container.querySelector('#edgeParamsWrap');
        if (wrap){
          wrap.innerHTML = buildEdgeParams(currentEdgeShape);
          bindPaneInteractions(moduleId, wrap);
        }
      });
    });
  }

  /* 形状 chip 互斥 */
  container.querySelectorAll('[data-group="shape"] .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      container.querySelectorAll('[data-group="shape"] .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      toast('形状：' + chip.textContent);
    });
  });

  /* 填满按钮 */
  const fb = container.querySelector('#fillShapeBtn');
  if (fb) fb.addEventListener('click', () => {
    const sizeRow = container.querySelector('[data-name="尺寸"]');
    if (sizeRow){
      const r = sizeRow.querySelector('input[type=range]');
      const n = sizeRow.querySelector('.num');
      if (r && n){ r.value = 200; n.value = 200; r.style.setProperty('--fill', '100%'); }
    }
    toast('形状已填满绘图区域');
  });
}

/* 重新渲染某个模块（不重新计算所有栏） */
function rerenderModule(moduleId){
  const container = document.querySelector(`.tab-groups[data-module="${moduleId}"]`);
  if (!container) return;
  const info = collectTabModuleInfo(moduleId);
  if (!info) return;
  const groups = info.groups || computeTabLayout(info.heights, 0);
  renderTabGroupsFromGroups(moduleId, container, info.tabs, groups);
  requestAnimationFrame(refreshLayout);
}

function paramRow(name, value, min = 0, max = 100, unit = '', opts = {}){
  const step = opts.step ?? 1;
  const showChain = opts.chain === true;
  const showReset = opts.reset === true;
  const cls = opts.tight ? 'param tight' : (opts.stacked ? 'param stacked' : 'param');
  return `<div class="${cls}" data-name="${name}" data-min="${min}" data-max="${max}" data-default="${value}">
    <span class="pname">${name}</span>
    <div class="pctrl">
      <input type="range" min="${min}" max="${max}" value="${value}" step="${step}">
      <input class="num" value="${value}">
      ${unit ? `<span class="unit">${unit}</span>` : ''}
      ${showChain ? `<button class="chain" title="参数联动">${CHAIN_SVG}</button>` : ''}
      ${showReset ? `<button class="rst" title="重置为默认值">⟲</button>` : ''}
    </div>
  </div>`;
}

function inlineChips(name, chips, activeIdx = 0, opts = {}){
  const groupAttr = opts.group ? `data-group="${opts.group}"` : '';
  return `<div class="param inline-chips" ${groupAttr}>
    <span class="pname">${name}</span>
    <div class="pctrl">
      <div class="chip-row">${chips.map((c, i) =>
        `<button class="chip${i === activeIdx ? ' active' : ''}">${c}</button>`).join('')}</div>
    </div>
  </div>`;
}

function stackedChips(name, chips, activeIdx = 0){
  return inlineChips(name, chips, activeIdx);
}

/* ============================================================
   画布渲染
   ============================================================ */
const cvs = $('#iconCanvas');
const ctx = cvs.getContext('2d');
let iconSize = 256;
const viewerModal = $('#viewerModal');
const modalBody = $('#modalBody');
const viewerCanvas = $('#viewerCanvas');

function drawGuides(S){
  const mode = $('#guideSelect').value;
  const safe = $('#safeChk').checked;
  if (mode !== 'none'){
    ctx.save();
    ctx.strokeStyle = 'rgba(110,122,150,.55)';
    ctx.lineWidth = 1;
    const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
    if (mode === 'cross'){ line(S/2, 0, S/2, S); line(0, S/2, S, S/2); }
    else if (mode === 'star'){ line(S/2, 0, S/2, S); line(0, S/2, S, S/2); line(0, 0, S, S); line(S, 0, 0, S); }
    else if (mode === 'thirds'){ for (let i = 1; i <= 2; i++){ line(S*i/3, 0, S*i/3, S); line(0, S*i/3, S, S*i/3); } }
    ctx.restore();
  }
  if (safe){
    const pct = Math.min(50, Math.max(0, +$('#safePct').value || 10));
    const m = S * pct / 100;
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(110,122,150,.7)';
    ctx.strokeRect(m, m, S - m*2, S - m*2);
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function drawIcon(){
  const S = iconSize;
  if (cvs.width !== S){ cvs.width = S; cvs.height = S; }
  ctx.clearRect(0, 0, S, S);
  const r = S * 0.22;
  roundRect(ctx, S*0.03, S*0.03, S*0.94, S*0.94, r);
  const g = ctx.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, '#6c8cff');
  g.addColorStop(1, '#9b5cff');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath();
  ctx.arc(S*0.74, S*0.31, S*0.23, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  const text = (rows[0] && rows[0].text) ? rows[0].text : 'K';
  ctx.fillStyle = '#ffffff';
  ctx.font = `800 ${Math.round(S*0.52)}px -apple-system, "Segoe UI", "PingFang SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text.slice(0, 3), S/2, S/2 + S*0.02);
  drawGuides(S);
  if (viewerCanvas){
    viewerCanvas.width = S; viewerCanvas.height = S;
    viewerCanvas.getContext('2d').drawImage(cvs, 0, 0);
  }
}

function paintIcon(canvas, p, S = 96){
  canvas.width = S; canvas.height = S;
  const c = canvas.getContext('2d');
  c.clearRect(0, 0, S, S);
  const g = c.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, p.c1);
  g.addColorStop(1, p.c2);
  c.fillStyle = g;
  roundRect(c, 2, 2, S - 4, S - 4, p.r * S / 96);
  c.fill();
  c.fillStyle = '#fff';
  c.font = `800 ${Math.round(S * 0.46)}px -apple-system,"Segoe UI","PingFang SC",sans-serif`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(p.text, S / 2, S / 2 + S * 0.02);
}

/* ============================================================
   预览交互
   ============================================================ */
let zoom = 1;
let panX = 0, panY = 0;
let dragging = false;
let dragStartX = 0, dragStartY = 0;
let startPanX = 0, startPanY = 0;

const wrap = $('#canvasWrap');
const stage = $('#stage');

function applyTransform(){
  wrap.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
}

stage.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  zoom = Math.min(3, Math.max(0.5, zoom + delta));
  applyTransform();
}, { passive: false });

stage.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  dragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  startPanX = panX; startPanY = panY;
  stage.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  panX = startPanX + (e.clientX - dragStartX);
  panY = startPanY + (e.clientY - dragStartY);
  applyTransform();
});
window.addEventListener('mouseup', () => {
  if (dragging){ dragging = false; stage.style.cursor = ''; }
});

stage.addEventListener('dblclick', e => {
  zoom = 1; panX = 0; panY = 0;
  applyTransform();
  stage.style.cursor = '';
  if (e.target.closest('.safe-box')) return;
  openViewer();
});

/* ============================================================

function init(){
  renderRowCount();
  renderLayoutChips();
  renderContentTabs();
  renderContentBody();
  renderFillList();
  renderFillBody2();
  renderPresets();
  renderHistory();

  drawIcon();
  updateSize();
  updateTopbarHeight();

  $('#safeBox').classList.add('show');
  $('#safeBox').style.inset = (iconSize * 0.1) + 'px';

  requestAnimationFrame(() => { refreshLayout(); });

  let resizeRAF = null;
  window.addEventListener('resize', () => {
    if (resizeRAF) cancelAnimationFrame(resizeRAF);
    resizeRAF = requestAnimationFrame(refreshLayout);
  });

  window.addEventListener('orientationchange', () => setTimeout(refreshLayout, 150));

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(refreshLayout);
  }

  if (window.ResizeObserver){
    let roRAF = null;
    const ro = new ResizeObserver(() => {
      if (roRAF) cancelAnimationFrame(roRAF);
      roRAF = requestAnimationFrame(() => {
        updateTopbarHeight();
        syncMergeTabs();
        relayoutAllModules();
        updatePreviewHeight();
        checkPreviewFloat();
      });
    });
    ['col-left', 'col-mid', 'col-right', 'layout'].forEach(cls => {
      const el = document.querySelector('.' + cls);
      if (el) ro.observe(el);
    });
  }

  document.querySelectorAll('.col, .layout').forEach(el => {
    el.addEventListener('scroll', () => {
      if (document.body.classList.contains('preview-float')){
        syncPreviewLayout();
      }
    }, { passive: true });
  });

  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
      e.preventDefault();
      toast('撤销（演示）');
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){
      e.preventDefault();
      toast('重做（演示）');
    }
  });

  setTimeout(() => toast('欢迎使用 KiconCreator · 双击预览进入 1:1 模态查看'), 400);
}

init();
</script>
</body>
</html>
