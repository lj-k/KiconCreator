<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IconKing · 图标制作器</title>
<style>
#__lf{position:fixed;inset:0;z-index:9999;background:var(--lf-bg,#eef5ee);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s,visibility .35s}
#__lf.gone{opacity:0;visibility:hidden}
#__lf .t{font-family:'Menlo','Consolas',monospace;font-size:12px;color:var(--lf-text,#6b8e6b);letter-spacing:.18em;text-transform:uppercase}
#__lf .b{width:180px;height:2px;background:var(--lf-bar,#cbdccb);position:relative;overflow:hidden}
#__lf .f{position:absolute;inset:0;width:0;background:var(--lf-fg,#4f7a4f);transition:width .16s ease-out}
body.lf-lock{overflow:hidden}
</style>
<script>
(function(){var f,t,done=false;function s(v){if(f)f.style.width=v+'%'}function fin(){if(done)return;done=true;s(100);setTimeout(function(){var o=document.getElementById('__lf');if(o)o.classList.add('gone');document.body&&document.body.classList.remove('lf-lock')},220)}function w(){var o=document.getElementById('__lf');if(!o){setTimeout(w,16);return}f=o.querySelector('.f');if(!f){fin();return}document.body.classList.add('lf-lock');s(0);t=setInterval(function(){if(parseInt(f.style.width||'0')<60){s((parseInt(f.style.width||'0')+6)+'%')}else if(parseInt(f.style.width||'0')<85){s((parseInt(f.style.width||'0')+2)+'%')}else{s((parseInt(f.style.width||'0')+.8)+'%')}},160)}w();if(document.readyState==='complete')fin();else window.addEventListener('load',fin);setTimeout(fin,15000)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet" onerror="this.href='https://fonts.loli.net/css2?family=Inter:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css'">
<style>
:root,[data-theme="light"]{
  --lf-bg:#f0f4f8;--lf-text:#5a7090;--lf-bar:#c5d4e6;--lf-fg:#3a5580;
  --bg-page:#ffffff;--bg-card:#ffffff;--bg-card-solid:#ffffff;
  --bg-rail:#f4f7fb;--bg-input:#ffffff;--bg-hover:#e8f0fa;--bg-deep:#c5d4e6;
  --bg-func:#e8f0fa;--bg-multi:#e8f5ff;--bg-single:#f0f6ff;
  --border:rgba(160,175,195,.35);--border-strong:#b8c4d4;
  --accent:#3a5580;--accent-hover:#2d4570;
  --text:#1e2d40;--text-sub:#5a7090;--text-muted:#8095a8;--text-inv:#ffffff;
  --shadow:rgba(60,80,120,.12);
}
[data-theme="warm"]{
  --lf-bg:#f5ead0;--lf-text:#8a7a50;--lf-bar:#e4d6a8;--lf-fg:#a67c52;
  --bg-page:#f5ead0;--bg-card:rgba(250,240,210,.9);--bg-card-solid:#faf0d2;
  --bg-rail:#f0e4c4;--bg-input:#fdf6e4;--bg-hover:#e8dbb8;--bg-deep:#dccda0;
  --border:rgba(160,130,70,.3);--border-strong:#c4b48a;
  --accent:#a67c52;--accent-hover:#8a6542;
  --text:#3d2e15;--text-sub:#7a6e4a;--text-muted:#a89b78;--text-inv:#ffffff;
  --shadow:rgba(120,100,50,.18);
}
[data-theme="dark"]{
  --lf-bg:#1a1d1a;--lf-text:#9bb0a0;--lf-bar:#2d3a2d;--lf-fg:#6fa870;
  --bg-page:#1a1d1a;--bg-card:rgba(30,34,30,.9);--bg-card-solid:#222622;
  --bg-rail:#262b26;--bg-input:#2e342e;--bg-hover:#343b34;--bg-deep:#3a453a;
  --border:rgba(120,160,120,.25);--border-strong:#4a5a4a;
  --accent:#6fa870;--accent-hover:#85b886;
  --text:#e4ebe4;--text-sub:#9bb0a0;--text-muted:#6a7a6a;--text-inv:#1a1d1a;
  --shadow:rgba(0,0,0,.4);
}
/* ── light 主题功能区额外浅蓝规则 ── */
[data-theme="light"] .col-hd{background:#e8f0fa;color:#2d4570}
[data-theme="light"] .col-bd .sec{background:transparent;border:none;padding:0 0 4px 0;margin-bottom:0;border-bottom:1px dashed #d8e1ee}
[data-theme="light"] .col-bd .sec:last-child{border-bottom:none}
[data-theme="light"] .col-bd .sec-t{background:transparent;color:#2d4570;border:none;font-weight:600;padding:6px 4px 4px;font-size:11px;margin:0 -2px 2px}
[data-theme="light"] .col-bd #outerSec{background:#e8f0fa;border:1px solid #c5d4e6;border-radius:8px;padding:4px}
[data-theme="light"] .col-bd #outerSec > .sec-t{background:#dce8f8;border:none;border-radius:4px;color:#2d4570;margin:-4px -4px 4px;padding:4px 8px}
[data-theme="light"] .sh-tabs{background:#f0f6ff;border-color:#c5d4e6}
[data-theme="light"] .sh-tab{background:#ffffff;color:#5a7090;border-radius:4px;border:1px solid #d8e1ee}
[data-theme="light"] .sh-tab.active{background:#b8d4f0;color:#1a3a60;border-color:#3a5580;font-weight:600}
[data-theme="light"] .sh-pane.active{background:#e8f0fa;border-color:#c5d4e6}
[data-theme="light"] .col-bd .sec .line-tabs{background:#f0f6ff;border:1px solid #d8e1ee;border-radius:6px;padding:3px}
[data-theme="light"] .preview-center{background:#f0f4f8;border:1px solid #d8e1ee;border-radius:8px}
[data-theme="light"] .chip{background:#ffffff;border:1px solid #d8e1ee;color:#3a5580}
[data-theme="light"] .chip.active{background:#3a5580;color:#fff;border-color:#3a5580}
[data-theme="light"] .btn{background:#f0f6ff;border:1px solid #c5d4e6;color:#2d4570}
[data-theme="light"] .btn:hover{background:#dce8f8}
[data-theme="light"] .btn-primary{background:#3a5580;color:#fff;border-color:#3a5580}
/* 三行/多行功能区：浅蓝色整块 */
[data-theme="light"] .col-bd .multi-block{background:#e8f5ff;border:1px solid #c5d4e6;border-radius:8px;padding:6px;margin-bottom:8px}
/* 样式面板标签连参数区 */
[data-theme="light"] .style-tabs{background:#e8f0fa;border-color:#c5d4e6}
[data-theme="light"] .style-tab{background:#ffffff;border:1px solid #d8e1ee;color:#5a7090}
[data-theme="light"] .style-tab.active{background:#b8d4f0;color:#1a3a60;border-color:#3a5580;font-weight:600}
[data-theme="light"] #stylePanel{background:#e8f0fa;border-color:#c5d4e6}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg-page);color:var(--text);font-family:'Noto Sans SC','Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;min-width:800px;min-height:400px;padding:10px;height:100vh;max-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr;min-width:0;height:auto;max-height:none;min-height:100vh;overflow-y:auto}}
.col{background:var(--bg-card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.col-hd{padding:9px 12px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-sub);display:flex;align-items:center;gap:7px;flex-shrink:0}
.col-hd i{font-size:11px;color:var(--accent)}
.col-bd{flex:1;overflow-y:auto;padding:12px}
.preview-center{display:flex;justify-content:center;margin:8px 0}
canvas#icon{border-radius:8px;box-shadow:0 4px 20px var(--shadow);background:#fff;max-width:100%}
.dl-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:6px 11px;border-radius:7px;cursor:pointer;border:1px solid var(--border-strong);background:var(--bg-card-solid);color:var(--text);transition:.12s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:var(--bg-hover)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--text-inv);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-sm{padding:4px 8px;font-size:10px}
.sec-t{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-sub);margin:10px 0 6px;display:flex;align-items:center;gap:5px}
.sec{margin-bottom:12px}.sec:last-child{margin-bottom:0}
/* ═══ PRESET — 严格 < 50px ═══ */
.preset-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:5px;justify-items:center}
.preset{width:48px;height:48px;max-width:48px;max-height:48px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:.12s;padding:2px;display:flex;align-items:center;justify-content:center}
.preset canvas{width:100%;height:100%;border-radius:5px}
.preset:hover{transform:translateY(-1px);box-shadow:0 2px 6px var(--shadow)}
.preset.active{border-color:var(--accent)}
.theme-row{display:flex;background:var(--bg-rail);border-radius:8px;padding:2px;margin-top:10px}
.theme-btn{flex:1;padding:6px;font-size:11px;text-align:center;border-radius:6px;cursor:pointer;color:var(--text-sub);font-family:'JetBrains Mono',monospace;transition:.12s;border:1px solid transparent}
.theme-btn.active{background:var(--bg-input);color:var(--accent);font-weight:600;border-color:var(--border-strong)}
.chip-row{display:flex;flex-wrap:wrap;gap:5px}
/* 形状和外框 三标签 */
.sh-tabs{display:flex;gap:2px;margin-bottom:0;background:var(--bg-input);border-radius:6px 6px 0 0;padding:2px;border:1px solid var(--border-strong);border-bottom:none}
.sh-tab{flex:1;text-align:center;padding:6px 4px;border-radius:4px;cursor:pointer;font-size:11px;color:var(--text);transition:.12s;background:transparent;user-select:none;border:none}
.sh-tab.active{background:rgba(70,140,230,.25);color:var(--accent);font-weight:600}
.sh-tab .tb-content::after{content:''}
.sh-pane{display:none;padding:6px 2px}
.sh-pane.active{display:block;background:rgba(70,140,230,.06);border-radius:0 0 6px 6px;padding:8px 6px;border:1px solid var(--border-strong)}
.btn-fill{padding:2px 8px;border-radius:4px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--accent);cursor:pointer;font-size:11px;margin-left:4px}
.btn-fill:hover{background:rgba(70,140,230,.15)}
.chip{padding:4px 9px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-card-solid);cursor:pointer;font-size:11px;color:var(--text-sub);transition:.12s;font-family:'JetBrains Mono',monospace}
.chip:hover{background:var(--bg-hover);color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ═══ LINE TABS — mode + 输入 二合一 ═══ */
.line-tabs{display:flex;flex-wrap:wrap;background:var(--bg-rail);border-radius:8px;padding:3px;margin-bottom:4px;gap:3px}
.line-tab{flex:1 1 calc(50% - 3px);min-width:0;box-sizing:border-box}
.line-tab{padding:2px;border-radius:6px;border:1px solid transparent;transition:.12s;display:flex;align-items:center;gap:4px;position:relative;outline:none;box-shadow:none}
.line-tab:focus{outline:none}
.line-tab *:focus{outline:none}
/* Bug3 fix: mode span 不能冒泡, z-index 更高 */
.line-tab .mode{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;font-size:10px;color:#fff;font-family:'JetBrains Mono',monospace;font-weight:700;cursor:pointer;transition:.12s;user-select:none;flex-shrink:0;position:relative;z-index:2}
.line-tab .mode.tmd{background:#4f7a4f}
.line-tab .mode.imd{background:#3a6eaa}
.line-tab .mode.fmd{background:#a64f3a}
.line-tab .mode:hover{transform:scale(1.1)}
.line-tab input{padding:4px 6px;border-radius:4px;border:1px solid var(--border);background:var(--bg-input);font-size:11px;font-family:'Noto Sans SC','Inter',sans-serif;color:var(--text);outline:none;text-align:center;width:50%;min-width:60px;max-width:140px;flex-shrink:0}
.line-tab input::placeholder{color:var(--text-muted)}
/* FA 图标选择器 */
.fa-picker{display:flex;flex-direction:column;gap:4px}
.fa-search{width:100%;padding:5px 8px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text);font-size:11px;outline:none;box-sizing:border-box}
.fa-search:focus{border-color:var(--accent)}
.fa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:3px;max-height:180px;overflow-y:auto;padding:4px;background:var(--bg-rail);border-radius:6px}
.fa-item{display:flex;align-items:center;justify-content:center;height:26px;border-radius:4px;cursor:pointer;color:var(--text-sub);font-size:13px;transition:.1s;border:1px solid transparent}
.fa-item:hover{background:var(--bg-input);color:var(--accent)}
.fa-item.sel{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.fa-more{font-size:10px;color:var(--text-muted);text-align:center;padding:2px}
.line-tab select.fa-sel{padding:3px 5px;border-radius:4px;border:1px solid var(--border-strong);background:var(--bg-input);font-size:11px;color:var(--text);min-width:80px}
.line-tab.active{background:var(--bg-input);border-color:var(--border-strong);box-shadow:0 2px 5px var(--shadow)}
.layout-group{display:flex;flex-wrap:wrap;gap:5px}
.layout-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-card-solid);cursor:pointer;font-size:11px;color:var(--text-sub);transition:.12s;font-family:'Noto Sans SC','Inter',sans-serif}
.layout-btn:hover{background:var(--bg-hover);color:var(--accent)}
.layout-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.style-tabs{display:flex;background:var(--bg-rail);border-radius:6px 6px 0 0;padding:2px;margin-bottom:0;flex-wrap:wrap;border:1px solid var(--border-strong);border-bottom:none}
.style-tab{padding:5px 10px;font-size:11px;border-radius:5px;cursor:pointer;color:var(--text-sub);font-family:'JetBrains Mono',monospace;transition:.12s;border:1px solid transparent}
.style-tab.active{background:rgba(70,140,230,.25);color:var(--accent);font-weight:600;border-color:transparent}
#stylePanel{background:rgba(70,140,230,.06);border:1px solid var(--border-strong);border-radius:0 0 6px 6px;padding:8px}
/* 预览模块 sticky（竖屏/窄窗口） */
@media (orientation: portrait) or (max-width: 1200px){#previewSec{position:sticky;top:6px;z-index:15}}
.form-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.form-row .lbl{font-size:11px;color:var(--text-sub);min-width:48px;font-family:'JetBrains Mono',monospace}
.form-row select,.form-row input[type="text"]{flex:1;padding:5px 8px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-input);font-size:12px;color:var(--text)}
.form-row select:focus,.form-row input[type="text"]:focus{outline:none;border-color:var(--accent)}
.form-row input[type="color"]{width:32px;height:26px;padding:0;border-radius:5px;border:1px solid var(--border-strong);background:var(--bg-input);cursor:pointer}
.form-row .num-input{width:46px;padding:2px 4px;border-radius:4px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text);font-size:11px;text-align:center;outline:none;margin-left:4px}
.form-row .num-input:focus{border-color:var(--accent)}
.form-row .v{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-sub);min-width:36px;text-align:right}
.form-row input[type="range"]{flex:1;-webkit-appearance:none;height:4px;background:var(--bg-deep);border-radius:4px}
.form-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-input);cursor:pointer}
.fill-tabs{display:flex;background:var(--bg-rail);border-radius:8px;padding:2px;margin-bottom:8px}
.fill-tab{flex:1;padding:7px 4px;font-size:10px;text-align:center;border-radius:6px;cursor:pointer;color:var(--text-sub);font-family:'JetBrains Mono',monospace;transition:.12s;border:1px solid transparent;letter-spacing:.06em}
.fill-tab.active{background:var(--bg-input);color:var(--accent);font-weight:600;border-color:var(--border-strong)}
.seg-grid{display:flex;gap:5px;margin-bottom:8px}
.seg-item{flex:1;max-width:25%;aspect-ratio:1;border-radius:6px;cursor:pointer;border:2px solid transparent;overflow:hidden;position:relative;transition:.12s;min-width:32px}
.seg-item:hover{transform:translateY(-1px);box-shadow:0 2px 6px var(--shadow)}
.seg-item.active{border-color:var(--accent)}
.seg-item canvas{width:100%;height:100%;display:block}
.seg-item .seg-idx{position:absolute;bottom:1px;right:2px;font-family:'JetBrains Mono',monospace;font-size:9px;color:#fff;background:rgba(0,0,0,.4);padding:0 3px;border-radius:3px}
.seg-mode-tabs{display:flex;background:var(--bg-rail);border-radius:6px;padding:2px;margin-bottom:8px}
.seg-mode-tab{flex:1;padding:5px 4px;font-size:10px;text-align:center;border-radius:4px;cursor:pointer;color:var(--text-sub);font-family:'JetBrains Mono',monospace;border:1px solid transparent}
.seg-mode-tab.active{background:var(--bg-input);color:var(--accent);font-weight:600;border-color:var(--border-strong)}
.bd-tabs{display:flex;background:var(--bg-rail);border-radius:8px;padding:2px;margin-bottom:8px}
.bd-tab{flex:1;padding:7px 4px;font-size:10px;text-align:center;border-radius:6px;cursor:pointer;color:var(--text-sub);font-family:'JetBrains Mono',monospace;border:1px solid transparent;letter-spacing:.06em}
.bd-tab.active{background:var(--bg-input);color:var(--accent);font-weight:600;border-color:var(--border-strong)}
.dropzone{border:2px dashed var(--border-strong);border-radius:8px;padding:10px;text-align:center;background:var(--bg-rail);cursor:pointer;font-size:11px;color:var(--text-sub);transition:.12s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--bg-hover)}
.hidden{display:none!important}
.check{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-card-solid);font-size:11px;color:var(--text-sub);cursor:pointer}
.check input{margin:0;accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
.suggest-row{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.suggest-chip{width:20px;height:20px;border-radius:4px;cursor:pointer;border:1px solid var(--border-strong);transition:.1s;position:relative}
.suggest-chip:hover{transform:scale(1.15)}
.suggest-chip::after{content:attr(title);position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff;background:rgba(0,0,0,.7);padding:2px 4px;border-radius:3px;white-space:nowrap;opacity:0;pointer-events:none}
.suggest-chip:hover::after{opacity:1}
/* FA 分类面板 */
.fa-tree{max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;background:var(--bg-card-solid)}
.fa-tree .fa-grp{border-bottom:1px solid var(--border);padding:4px 6px}
.fa-tree .fa-grp:last-child{border-bottom:none}
.fa-tree .fa-grp-t{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-bottom:3px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.fa-tree .fa-grp-t .caret{transition:.2s}
.fa-tree .fa-grp.collapsed .caret{transform:rotate(-90deg)}
.fa-tree .fa-grp.collapsed .fa-grid{display:none}
.fa-tree .fa-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.fa-tree .fa-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;color:var(--text-sub);font-size:12px;transition:.1s}
.fa-tree .fa-ic:hover{background:var(--bg-hover);color:var(--accent)}
.fa-tree .fa-ic.selected{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="__lf" aria-hidden="true"></div>
<div class="app">
  <!-- ═══ LEFT: PREVIEW + PRESETS + DL + THEME ═══ -->
  <section class="col">
    <div class="col-hd"><i class="fa-solid fa-eye"></i>预览 · 预设 · 导出</div>
    <div class="col-bd">
      <!-- 预览模块 -->
      <div class="sec" id="previewSec">
        <div class="sec-t"><i class="fa-solid fa-eye"></i>预览</div>
        <div class="preview-center">

// ═══════ COLOR UTILS ═══════
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return{r,g,b}}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v|0)).toString(16).padStart(2,'0')).join('')}
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(Math.min(k(n)-3,9-k(n)),1));return rgbToHex(f(0)*255,f(8)*255,f(4)*255)}
function hexToHsl(h){const{r,g,b}=hexToRgb(h);const rn=r/256,gn=g/256,bn=b/256;const mx=Math.max(rn,gn,bn),mn=Math.min(rn,gn,bn);let hh,s;const l=(mx+mn)/2;if(mx===mn){hh=0;s=0}else{const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=(mx===rn?(gn-bn)/(d+(gn<bn?6:0)):mx===gn?(bn-rn)/(d+2):(rn-gn)/(d+4))*60}return{h:hh,s:s*100,l:l*100}}
function colorSuggestions(hex){
  const H=hexToHsl(hex);
  return {
    complement:hslToHex((H.h+180)%360,H.s,H.l),
    analogous:hslToHex((H.h+30)%360,H.s,H.l),
    soft:hslToHex(H.h,Math.max(30,H.s*0.55),Math.min(75,H.l*1.15)),
    bright:hslToHex(H.h,Math.min(100,H.s*1.3),Math.min(85,H.l+15))
  };
}

let S=JSON.parse(JSON.stringify(DEFAULTS));

// roundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number')r={tl:r,tr:r,br:r,bl:r};
    this.beginPath();this.moveTo(x+r.tl,y);this.lineTo(x+w-r.tr,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r.tr);this.lineTo(x+w,y+h-r.br);
    this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);this.lineTo(x+r.bl,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r.bl);this.lineTo(x,y+r.tl);
    this.quadraticCurveTo(x,y,x+r.tl,y);this.closePath();
  };
}

// ═══════ SHAPE PATH V3 — none/rounded-rect/方向0下边水平/radius100圆/inner0消失 ═══════
function shapePath(c,size){
  c.beginPath();
  const sz=(S.shapeSize||100)/100, hs=(S.shapeHStretch||100)/100, vs=(S.shapeVStretch||100)/100;
  const base=size*0.5*sz, cx=size/2, cy=size/2;
  // direction=0 时下边水平：起始角为 -π/2 + π/(2n) 使底边水平
  // 但简单做法：direction=0 时使用初始角度 -π/2 但对偶数边形让底边水平
  // 改为 direction 直接作为起始方向（0°→朝右），然后整体旋转使第一个顶点对准方向
  c.save();c.translate(cx,cy);c.scale(hs,vs);c.translate(-cx,-cy);
  if(S.shape==='none'){ c.restore(); return; }
  else if(S.shape==='circle'){ c.arc(cx,cy,base-Math.max(2,Math.round(size*0.02)),0,Math.PI*2); }
  else if(S.shape==='rounded-rect'){
    const x=cx-base,y=cy-base,w=base*2,h=base*2;
    const maxR=Math.min(w,h)/2;
    const r=maxR*(S.radius/100); // radius 0→直角方 100→圆形
    rrRect(c,x,y,w,h,r);
  }
  else if(S.shape==='polygon'){
    const n=S.shapeSides||4;
    let rOut=base, rIn=rOut;
    // 需求 1：direction=0 下边水平
    // 策略：起始角 设为 π/2 - π/(2n) 时底边水平（偶数边），direction 从 0 开始旋转这个基础
    // 简化：rot = direction° + 让偶数边形底边水平的偏移
    // 对偶数边：偏移 -π/2 使顶点朝上 → 再加 direction
    // 需求修正：让所有形状 direction=0 时下边水平
    // 对 n=4（方形）：顶点在 top/right/bottom/left → rot=-π/2 让"第一个顶点"在上
    // 但用户说"下边水平"——对正多边形所有边水平是不可能的，应该指底边那条边水平
    // 让边 i=0 的方向 = 底边（向量 (1,0)）→ 计算旋转使边 (p0→p1) 或 (pn/2→pn/2+1) 水平
    // 最简单可靠方案：rot = (S.direction||0)*Math.PI/180 - Math.PI/2 + ((n%2)?Math.PI/n:0)
    // 测试：n=4(even, square): rot = dir - 90° + 0 → 边 1→2 (右边) 是垂直的... 底边是水平的 ✓
    // n=3(triangle,odd): rot = dir - 90° + 60° = dir - 30° → 让底边水平
    // 验证 n=4: p0(rot-90°), p1(rot), p2(rot+90°), p3(rot+180°)
    //   edge p2→p3: angle (rot+180) - (rot+90) = 90° → 向量方向 π+rot+90 = rot+90 →
    //   水平当 rot+90 = 0 或 π → rot=-90 → direction=0 时正好 ✓
    // 验证 n=3: p0(-30°), p1(90°), p2(210°)
    //   edge p2→p0: angle -30 - 210 = -240°, vec(1,0) 方向 0° → 210° 点到 -30° 点
    //   vec = (cos(-30)-cos(210), sin(-30)-sin(210)) = (√3/2 - (-√3/2), -0.5-(-0.5)) = (√3, 0) → 水平 ✓
    const rot=(S.direction||0)*Math.PI/180 - Math.PI/2 + ((n%2)?Math.PI/n:0);
    const pts=[];
    if(S.shapeStar){
      const ang=Math.max(0,Math.min(180,S.shapeInner||0));
      // 需求 3：内角 0 → 消失
      if(ang<1){ c.restore(); return; }
      rIn = rOut * (0.05 + ang/180*0.90);
      for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n;pts.push([cx+Math.cos(a)*(i%2===0?rOut:rIn),cy+Math.sin(a)*(i%2===0?rOut:rIn)]);}
    } else {
      for(let i=0;i<n;i++){const a=rot+i*Math.PI*2/n;pts.push([cx+Math.cos(a)*rOut,cy+Math.sin(a)*rOut]);}
    }
    // 需求 2：radius=100 → 圆形（正多边形顶点都在同一个外接圆上，100% 倒角后就是圆弧）
    if(S.radius>=100 && !S.shapeStar){
      c.arc(cx,cy,base-Math.max(2,Math.round(size*0.02)),0,Math.PI*2);
      c.restore();
      return;
    }
    if(S.radius>0 && S.radius<=100){
      if(S.radius>=99.99){
        c.arc(cx,cy,base-Math.max(2,Math.round(size*0.02)),0,Math.PI*2);
        c.restore();return;
      }
      let minDist=Infinity;
      for(let i=0;i<pts.length;i++){
        const v=pts[(i-1+pts.length)%pts.length],p=pts[i],q=pts[(i+1)%pts.length];
        minDist=Math.min(minDist,pointToSegDist(p,v,q));
      }
      const x=S.radius/100;
      const smoothX=1-Math.pow(1-x,2);
      const r0 = minDist * smoothX * 0.95;
      if(r0>0.5){
        c.moveTo(pts[0][0],pts[0][1]);
        for(let i=0;i<pts.length;i++){
          const p1=pts[i],p2=pts[(i+1)%pts.length],p3=pts[(i+2)%pts.length];
          const ang1=Math.atan2(p1[1]-p2[1],p1[0]-p2[0]);
          const ang2=Math.atan2(p3[1]-p2[1],p3[0]-p2[0]);
          const d1=Math.hypot(p1[0]-p2[0],p1[1]-p2[1]);
          const d2=Math.hypot(p3[0]-p2[0],p3[1]-p2[1]);
          const k=Math.min(r0/(d1/2||1),r0/(d2/2||1),1);
          c.lineTo(p2[0]+Math.cos(ang1)*d1*k,p2[1]+Math.sin(ang1)*d1*k);
          c.quadraticCurveTo(p2[0],p2[1],p2[0]+Math.cos(ang2)*d2*k,p2[1]+Math.sin(ang2)*d2*k);
        }
        c.closePath();
      } else { pts.forEach(([x,y],i)=>{c[i?'lineTo':'moveTo'](x,y);}); c.closePath(); }
    } else { pts.forEach(([x,y],i)=>{c[i?'lineTo':'moveTo'](x,y);}); c.closePath(); }
  }
  c.restore();
}

// 圆角矩形辅助
function rrRect(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  if(r<=0){c.rect(x,y,w,h);return;}
  c.beginPath();
  c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);
  c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);
  c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);
  c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r);
  c.arcTo(x,y,x+r,y,r);
  c.closePath();
}

function pointToSegDist(p,v,q){
  const dx=q[0]-v[0],dy=q[1]-v[1];
  const len2=dx*dx+dy*dy;
  if(len2<1e-9)return Math.hypot(p[0]-v[0],p[1]-v[1]);
  let t=((p[0]-v[0])*dx+(p[1]-v[1])*dy)/len2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p[0]-v[0]-t*dx,p[1]-v[1]-t*dy);
}

// ═══════ FILL SEGMENT ═══════
function fillSegment(c,seg,x,y,w,h){
  if(seg.mode==='solid'){ c.fillStyle=seg.solid; c.fillRect(x,y,w,h); }
  else if(seg.mode==='gradient'){
    let g;
    if(seg.gradient.type==='radial') g=c.createRadialGradient(x+w/2,y+h/2,0,x+w/2,y+h/2,Math.max(w,h)/2);
    else g=c.createLinearGradient(x,y,x+Math.cos(seg.gradient.angle*Math.PI/180)*w,y+Math.sin(seg.gradient.angle*Math.PI/180)*h);
    g.addColorStop(0,seg.gradient.start);g.addColorStop(1,seg.gradient.end);
    c.fillStyle=g;c.fillRect(x,y,w,h);
  } else if(seg.mode==='image' && seg.image.url){
    const img=seg._img||(seg._img=new Image());
    if(img.src!==seg.image.url){img.onload=()=>{};img.src=seg.image.url;}
    if(img.complete&&img.naturalWidth>0){
      const s=seg.image.scale/100,r=Math.min(w/img.width,h/img.height),dw=img.width*r*s,dh=img.height*r*s;
      let dy=y+h/2-dh/2;
      if(seg.image.pos==='top')dy=y;if(seg.image.pos==='bottom')dy=y+h-dh;
      c.drawImage(img,x+w/2-dw/2,dy,dw,dh);
    } else c.fillStyle='#eee',c.fillRect(x,y,w,h);
  }
}

// ═══════ DRAW BG ═══════
function drawBg(c,size){
  c.save();
  if(S.shape==='none'){
    // 无形状时画整个画布
    const m=Math.max(2,Math.round(size*0.02));
    c.rect(m,m,size-m*2,size-m*2);c.clip();
  } else {
    shapePath(c,size);c.clip();
  }
  const m=Math.max(2,Math.round(size*0.02));
  const x=m,y=m,w=size-m*2,h=size-m*2;
  const segs=S.bg.segments;
  const n=segs.length;
  // Bug2 fix: overlap 1px 消除抗锯齿缝
  const OL=1.5;
  // 累计比例（空值均分）
  const ratios = (()=>{
    if(!S.bg.ratios||S.bg.ratios.length<n) return Array(n).fill(100/n);
    const arr = S.bg.ratios.slice(0,n);
    return arr.map(v=>isFinite(v)?v:100/n);
  })();
  // 归一化
  const sum = ratios.reduce((a,b)=>a+b,0);
  const nr = ratios.map(r=>r/sum);

  if(n===1){
    fillSegment(c,segs[0],x,y,w,h);
  } else if(n===2){
    // 垂直切分 + 角度旋转
    const cx=x+w/2,cy=y+h/2,ang=S.bg.angle*Math.PI/180;
    c.save();c.translate(cx,cy);c.rotate(ang);c.translate(-cx,-cy);
    const R=nr[0];
    // 左右切，y 方向 overlap
    fillSegment(c,segs[0],x,y,w*R+OL,h);
    fillSegment(c,segs[1],x+w*R-OL,y,w*(1-R)+OL,h);
    c.restore();
  } else if(n===3){
    const cx=x+w/2,cy=y+h/2,ang=S.bg.angle*Math.PI/180;
    c.save();c.translate(cx,cy);c.rotate(ang);c.translate(-cx,-cy);
    const R=nr[0];
    fillSegment(c,segs[0],x,y,w,h*R+OL);
    fillSegment(c,segs[1],x,y+h*R-OL,w/2+OL,h*(1-R)+OL);
    fillSegment(c,segs[2],x+w/2-OL,y+h*R-OL,w/2+OL,h*(1-R)+OL);
    c.restore();
  } else if(n===4){
    const R1=nr[0]/(nr[0]+nr[1]); // 横向切分比例
    const R2=nr[0]/(nr[0]+nr[2]); // 纵向切分比例（左上占比）
    fillSegment(c,segs[0],x,y,w*R1+OL,h*R2+OL);
    fillSegment(c,segs[1],x+w*R1-OL,y,w*(1-R1)+OL,h*R2+OL);
    fillSegment(c,segs[2],x,y+h*R2-OL,w*R1+OL,h*(1-R2)+OL);
    fillSegment(c,segs[3],x+w*R1-OL,y+h*R2-OL,w*(1-R1)+OL,h*(1-R2)+OL);
  }
  // Bug4 fix: 过渡边界 (transMode)
  if(S.bg.transMode&&S.bg.transMode!=='none'&&n>1){
    const tw = Math.max(1,S.bg.transWidth||8)*size/256;
    const cx=x+w/2,cy=y+h/2,ang=S.bg.angle*Math.PI/180;
    c.save();c.translate(cx,cy);c.rotate(ang);c.translate(-cx,-cy);
    c.globalCompositeOperation='destination-in';
    const bd = S.bg.borderShape||'line';
    c.strokeStyle='#000';
    c.lineWidth=tw;
    c.beginPath();
    if(n===2){
      if(bd==='curve'){
        c.moveTo(x+w/2,y);c.quadraticCurveTo(x+w/2+tw*2,y+h/2,x+w/2,y+h);
      } else {
        c.moveTo(x+w/2,y);c.lineTo(x+w/2,y+h);
      }
    } else if(n===3){
      c.moveTo(x,y+h*nr[0]);c.lineTo(x+w,y+h*nr[0]);
      c.moveTo(x+w/2,y+h*nr[0]);c.lineTo(x+w/2,y+h);
    } else if(n===4){
      c.moveTo(x+w*R1,y);c.lineTo(x+w*R1,y+h);
      c.moveTo(x,y+h*R2);c.lineTo(x+w,y+h*R2);
    }
    c.stroke();
    c.restore();
  }
  c.restore();
}

function drawShapeOuter(c,size){
  if(S.shape==='none')return;
  if(S.border&&S.border.on){
    shapePath(c,size);
    c.lineWidth=Math.round((S.border.w||3)*size/256);
    c.strokeStyle=S.border.color||'#ffffff';
    c.stroke();
  }
}
// shadow 必须在 drawBg 之前调用（背景覆盖在 shadow 本体上，shadow 模糊边缘暴露在外部）
function drawShapeShadow(c,size){
  if(S.shape==='none')return;
  if(!(S.bgShadow&&S.bgShadow.on))return;
  const sz=(S.bgShadow.size||100)/100;
  const blur=Math.max(2,Math.round((S.bgShadow.b||8)*size/256*sz));
  const ox=Math.round((S.bgShadow.x||0)*size/256*sz);
  const oy=Math.round((S.bgShadow.y||3)*size/256*sz);
  c.save();
  c.shadowColor=S.bgShadow.color||'rgba(0,0,0,0.5)';
  c.shadowBlur=blur;
  c.shadowOffsetX=ox;
  c.shadowOffsetY=oy;
  shapePath(c,size);
  c.fillStyle='rgba(0,0,0,1)';c.fill();
  c.restore();
}

// ═══════ LAYOUT ═══════
function computeLayout(lc,layout,size){
  const cx=size/2,cy=size/2,m=size*0.14,W=size-m*2,H=size-m*2,pos=[];
  const ringPts=(n,r)=>{const arr=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*Math.PI*2/n;arr.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return arr;};
  if(lc===1){
    if(layout==='h-top')pos.push([cx,m+H*0.18]);else if(layout==='h-bottom')pos.push([cx,m+H*0.82]);
    else if(layout==='v-left')pos.push([m+W*0.18,cy]);else if(layout==='v-right')pos.push([m+W*0.82,cy]);
    else pos.push([cx,cy]);
  } else if(lc===2){
    if(layout==='all-top'){pos.push([cx,cy-H*0.3]);pos.push([cx,cy-H*0.3]);}
    else if(layout==='all-bottom'){pos.push([cx,cy+H*0.3]);pos.push([cx,cy+H*0.3]);}
    else if(layout==='all-left'){pos.push([cx-W*0.3,cy]);pos.push([cx-W*0.3,cy]);}
    else if(layout==='all-right'){pos.push([cx+W*0.3,cy]);pos.push([cx+W*0.3,cy]);}
    else if(layout==='h-left-right'){pos.push([cx-W*0.25,cy]);pos.push([cx+W*0.25,cy]);}
    else pos.push([cx,cy-H*0.22],[cx,cy+H*0.22]);
  } else if(lc===3){
    if(layout==='row-h'){for(let i=0;i<3;i++)pos.push([cx-W*0.3+i*W*0.3,cy]);}
    else if(layout==='row-v'){for(let i=0;i<3;i++)pos.push([cx,cy-H*0.3+i*H*0.3]);}
    else if(layout==='t-inverted'){pos.push([cx,cy+H*0.28],[cx-W*0.25,cy-H*0.12],[cx+W*0.25,cy-H*0.12]);}
    else pos.push([cx,cy-H*0.28],[cx-W*0.25,cy+H*0.12],[cx+W*0.25,cy+H*0.12]);
  } else if(lc===4){
    if(layout==='row-h'){for(let i=0;i<4;i++)pos.push([cx-W*0.35+i*W*0.233,cy]);}
    else if(layout==='row-v'){for(let i=0;i<4;i++)pos.push([cx,cy-H*0.35+i*H*0.233]);}
    else if(layout==='l-121-v'){pos.push([cx,cy-H*0.30],[cx-W*0.25,cy],[cx+W*0.25,cy],[cx,cy+H*0.30]);}
    else if(layout==='l-121-h'){pos.push([cx-W*0.28,cy-H*0.15],[cx-W*0.28,cy+H*0.15],[cx,cy],[cx+W*0.28,cy-H*0.15]);}
    else pos.push([cx-W*0.25,cy-H*0.25],[cx+W*0.25,cy-H*0.25],[cx-W*0.25,cy+H*0.25],[cx+W*0.25,cy+H*0.25]);
  } else if(lc===5){
    if(layout==='row-h'){for(let i=0;i<5;i++)pos.push([cx-W*0.4+i*W*0.2,cy]);}
    else if(layout==='row-v'){for(let i=0;i<5;i++)pos.push([cx,cy-H*0.4+i*H*0.2]);}
    else{pos.push([cx,cy]);pos.push(...ringPts(4,Math.min(W,H)*0.32));}
  } else if(lc===6){
    if(layout==='row-h'){for(let i=0;i<6;i++)pos.push([cx-W*0.45+i*W*0.18,cy]);}
    else if(layout==='row-v'){for(let i=0;i<6;i++)pos.push([cx,cy-H*0.45+i*H*0.18]);}
    else pos.push(...ringPts(6,Math.min(W,H)*0.32));
  }
  return pos;
}

// ═══════ DRAW CONTENT ═══════
function drawContent(c,size){
  const pos=computeLayout(S.lineCount,S.layout,size);
  pos.forEach((p,i)=>{
    const line=S.lines[i];if(!line)return;
    const cx=p[0],cy=p[1];
    const hOff=(line.hOffset||0)*size/256, vOff=(line.vOffset||0)*size/256;
    const hs=(line.hStretch||100)/100, vs=(line.vStretch||100)/100;
    const overflow=!!(line.overflow&&line.overflow.show);
    let hasShadow=false;
    if(line.shadow&&line.shadow.on){
      c.save();
      c.shadowColor=line.shadow.color;
      c.shadowBlur=Math.round(line.shadow.blur*size/256);
      c.shadowOffsetX=Math.round(line.shadow.x*size/256);
      c.shadowOffsetY=Math.round(line.shadow.y*size/256);
      hasShadow=true;
    }
    if(line.mode==='text'){
      const hasCJK=/[\u4e00-\u9fff]/.test(line.text);
      const fam=hasCJK?line.zhFont:line.font;
      let fs=size*line.size/100;
      c.textAlign='center';c.textBaseline='middle';
      c.font=`${line.weight} ${Math.max(1,fs)}px "${fam}", sans-serif`;
      if(line.fillMode==='gradient'&&line.text){
        const w=c.measureText(line.text).width;
        const oc=document.createElement('canvas');
        oc.width=Math.ceil(w)+8;oc.height=Math.ceil(fs*1.6)+8;
        const ocx=oc.getContext('2d');
        ocx.font=c.font;ocx.textAlign='center';ocx.textBaseline='middle';
        const g=ocx.createLinearGradient(0,0,oc.width,0);
        g.addColorStop(0,line.fillGradS||'#fff');g.addColorStop(1,line.fillGradE||'#3a5580');
        ocx.fillStyle=g;
        ocx.fillText(line.text,oc.width/2,oc.height/2);
        c.save();
        c.translate(cx+hOff,cy+vOff);c.scale(hs,vs);
        c.globalCompositeOperation='source-over';
        c.drawImage(oc,-oc.width/2,-oc.height/2);
        c.restore();
      } else {
        c.save();c.translate(cx+hOff,cy+vOff);c.scale(hs,vs);
        c.globalAlpha=1;c.globalCompositeOperation='source-over';
        c.fillStyle=line.color;
        c.font=`${line.weight} ${fs}px "${fam}", sans-serif`;
        c.textAlign='center';c.textBaseline='middle';
        c.fillText(line.text,0,0);
        c.restore();
      }
    } else if(line.mode==='fa'){
      const glyph=faResolve(line.faIcon);
      let fs=size*(line.faSize||65)/100;
      c.save();c.translate(cx+hOff,cy+vOff);c.scale(hs,vs);
      c.globalAlpha=1;c.globalCompositeOperation='source-over';
      c.font=`${fs}px "Font Awesome 6 Free","FontAwesome","Font Awesome 5 Free","Inter",sans-serif`;
      c.textAlign='center';c.textBaseline='middle';
      c.fillStyle=line.faColor||'#fff';
      c.fillText(glyph,0,0);
      c.restore();
    } else if(line.mode==='image'&&line.imgUrl){
      const img=line._img||(line._img=new Image());
      if(img.src!==line.imgUrl){img.onload=()=>{line._needsRedraw=true;};img.src=line.imgUrl;}
      if(img.complete&&img.naturalWidth>0){
        const s=(line.imgScale||100)/100,r=Math.min(size*0.7/img.width,size*0.4/img.height),dw=img.width*r*s*hs,dh=img.height*r*s*vs;
        c.drawImage(img,cx-dw/2+hOff,cy-dh/2+vOff,dw,dh);
      } else {c.fillStyle='#aaa';c.fillRect(cx-20+hOff,cy-20+vOff,40*hs,40*vs);}
    }
    if(hasShadow)c.restore();
  });
}

// ═══════ MAIN DRAW ═══════
function draw(cc,sz){
  const c=cc||ctx,size=sz||S.size;
  if(cc===undefined&&sz===undefined){canvas.width=size;canvas.height=size;c.clearRect(0,0,size,size);}
  else{c.clearRect(0,0,size,size);}
  drawShapeShadow(c,size);
  drawBg(c,size);
  drawShapeOuter(c,size);
  drawContent(c,size);
  // Bug1 fix: transparentBg —— 只把近白色像素换成透明，不是整个背景消失
  if(S.transparentBg){
    const d=c.getImageData(0,0,size,size);
    const data=d.data;const tol=30;
    for(let i=0;i<data.length;i+=4){
      const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      if(a>0 && r>=255-tol && g>=255-tol && b>=255-tol){
        data[i+3]=0;
      }
    }
    c.putImageData(d,0,0);
  }
}

function matchShape(v){
  if(v==='none')return S.shape==='none';
  if(v==='circle')return S.shape==='circle';
  if(v==='rounded-rect')return S.shape==='rounded-rect';
  if(v.startsWith('p'))return S.shape==='polygon'&&!S.shapeStar&&S.shapeSides===+v.slice(1);
  if(v.startsWith('s'))return S.shape==='polygon'&&S.shapeStar&&S.shapeSides===+v.slice(1);
  return false;
}
function setShape(v){
  if(v==='none')S.shape='none';
  else if(v==='circle')S.shape='circle';
  else if(v==='rounded-rect'){S.shape='rounded-rect';S.shapeSize=100;}
  else{S.shape='polygon';S.shapeStar=v.startsWith('s');S.shapeSides=+v.slice(1);}
  // 需求 5：圆角方形默认尺寸使长边=画布
  if(v==='rounded-rect'){S.shapeSize=100;}
  updateShapeToggles();
  updateTabBadges(); // 需求 9

function updateShapeToggles(){

  $('innerWrap').style.display=(S.shape==='polygon'&&S.shapeStar)?'':'none';

}

// 行 Tab — Bug3 fix: mode span 独立容器阻止冒泡
function renderLineTabs(){
  const c=$('lineTabs');c.innerHTML='';
  for(let i=0;i<S.lineCount;i++){
    const line=S.lines[i];
    const tab=document.createElement('div');
    tab.className='line-tab'+(S.currentLine===i?' active':'');
    // mode 徽标 —— 独立 span，pointer-events 单独处理
    const modeSpan=document.createElement('span');
    modeSpan.className='mode '+(line.mode==='text'?'tmd':line.mode==='image'?'imd':'fmd');
    modeSpan.textContent=line.mode==='text'?'文':line.mode==='image'?'图':'F';
    modeSpan.title='点击切换内容模式';
    // Bug3 fix: 直接在 modeSpan 上绑定 click，并 stopPropagation
    modeSpan.addEventListener('click',(e)=>{
      e.stopPropagation();e.preventDefault();
      const order=['text','image','fa'];
      const idx=order.indexOf(line.mode);
      line.mode=order[(idx+1)%3];
      S.lines[i]=line;
      // Bug6 fix: 切模式后重置 _curStyleTab，同时重建 tabs 和 panel
      _curStyleTab='font';// 会在 renderStyleTabs 内校正为第一个可用 tab
      renderStyleTabs();renderStylePanel();renderLineTabs();draw();

      inp.addEventListener('focus',()=>{S.currentLine=i;updateLineTabActive();renderStylePanel();$('curLabel').textContent='· 行'+(i+1);});
      inp.addEventListener('input',e=>{S.lines[i].text=e.target.value;draw();});

      const icon=line.faIcon||'fa-star';

      box.innerHTML='<i class="fa-solid '+icon+'"></i><small style="color:var(--text-muted);font-size:10px">'+icon.replace('fa-','')+'</small>';
      tab.appendChild(box);

      tab.appendChild(box);
    }
    tab.addEventListener('click',(e)=>{
      // 只有点击 tab 本身（不含 modeSpan）才切换 currentLine
      if(e.target===tab){S.currentLine=i;updateLineTabActive();renderStylePanel();$('curLabel').textContent='· 行'+(i+1);}
    });
    // 实际：直接让整个 tab 的 click = 切换 currentLine（modeSpan 已经 stopPropagation 了）
    tab.addEventListener('click',()=>{S.currentLine=i;updateLineTabActive();renderStylePanel();$('curLabel').textContent='· 行'+(i+1);});
    c.appendChild(tab);
  }
}

function addSuggestTextColor(bgColor){
  const H=hexToHsl(bgColor);
  // 补色 = 背景的反色
  const compColor=hslToHex((H.h+180)%360, Math.min(100,H.s+10), 55);
  const row=document.createElement('div');row.className='suggest-row';
  [{k:'互补',v:compColor},{k:'类似',v:hslToHex((H.h+30)%360,H.s,55)},{k:'柔和',v:hslToHex(H.h,Math.max(30,H.s*0.5),70)},{k:'明亮',v:hslToHex(H.h,Math.min(100,H.s+20),75)}].forEach(({k,v})=>{
    const c=document.createElement('div');c.className='suggest-chip';c.style.background=v;c.title=k;
    c.onclick=()=>{const l=S.lines[S.currentLine];if(l.fillMode==='solid'){l.color=v;const tc=$('tc');if(tc)tc.value=v;}else{l.fillGradS=v;const tc1=$('tc1');if(tc1)tc1.value=v;}draw();};
    row.appendChild(c);
  });
  const fr=document.createElement('div');fr.className='form-row';
  const lbl=document.createElement('div');lbl.className='lbl';lbl.textContent='建议';
  fr.appendChild(lbl);fr.appendChild(row);
  $('stylePanel').appendChild(fr);
}

let _curSeg=0;
function ensureSegs(n){while(S.bg.segments.length<n)S.bg.segments.push(newSegment());while(S.bg.segments.length>n)S.bg.segments.pop();S.bg.numSegs=n;if(_curSeg>=n)_curSeg=0;}
function drawSegGrid(){
  const el=$('segGrid');el.innerHTML='';
  S.bg.segments.forEach((seg,i)=>{
    const d=document.createElement('div');d.className='seg-item'+(i===_curSeg?' active':'');
    const c=document.createElement('canvas');c.width=64;c.height=64;const cx=c.getContext('2d');
    fillSegment(cx,seg,0,0,64,64);
    d.appendChild(c);
    const idx=document.createElement('div');idx.className='seg-idx';idx.textContent=i+1;d.appendChild(idx);
    d.onclick=()=>{_curSeg=i;drawSegGrid();renderSegEditor();};
    el.appendChild(d);
  });
  // Bug5 fix: 布局功能区始终显示（数量多时才能看到效果）
  $('splitLayoutSec').style.display='';
  renderSplitRatios();
}
function renderSplitRatios(){
  const c=$('splitRatios');c.innerHTML='';
  const n=S.bg.segments.length;if(n<2)return;
  for(let i=0;i<n-1;i++){
    const v=S.bg.ratios[i]!==undefined?S.bg.ratios[i]:50;
    const row=document.createElement('div');row.className='form-row';
    row.innerHTML=`<div class="lbl">比例${i+1}</div><input type="range" min="10" max="90" value="${v}" data-rt="${i}"><span class="v">${v}%</span>`;
    c.appendChild(row);
    const inp=row.querySelector('input');
    inp.oninput=e=>{const idx=+e.target.dataset.rt,val=+e.target.value;S.bg.ratios[idx]=val;row.querySelector('.v').textContent=val+'%';draw();};
  }
}
function renderSegEditor(){
  const seg=S.bg.segments[_curSeg];
  document.querySelectorAll('.seg-mode-tab').forEach(t=>t.classList.toggle('active',t.dataset.smode===seg.mode));
  $('segSolid').classList.toggle('hidden',seg.mode!=='solid');
  $('segGrad').classList.toggle('hidden',seg.mode!=='gradient');
  $('segImg').classList.toggle('hidden',seg.mode!=='image');
  $('segSolidColor').value=seg.solid;
  $('segGradS').value=seg.gradient.start;$('segGradE').value=seg.gradient.end;
  $('segGradAng').value=seg.gradient.angle;$('segGradAngV').textContent=seg.gradient.angle+'°';
  $('segImgScale').value=seg.image.scale;$('segImgScaleV').textContent=seg.image.scale+'%';
  $('segImgPos').value=seg.image.pos;
  // grad type
  const gt=$('segGradType');gt.innerHTML='';
  [{v:'linear',l:'线性'},{v:'radial',l:'径向'}].forEach(({v,l})=>{
    const d=document.createElement('div');d.className='chip'+(seg.gradient.type===v?' active':'');d.textContent=l;
    d.onclick=()=>{seg.gradient.type=v;renderSegEditor();draw();drawSegGrid();};
    gt.appendChild(d);
  });
  // solid suggestions（基于第一个 line 颜色）
  const row=$('segSolidSug');row.innerHTML='';
  const textColor=(S.lines[0]&&S.lines[0].color)||'#ffffff';
  const ss=colorSuggestions(textColor);

    const c=document.createElement('div');c.className='suggest-chip';c.style.background=v;c.title=k;

  });
}

function applyPreset(p){
  S=JSON.parse(JSON.stringify(DEFAULTS));
  // Bug1 fix: 每个 line 必须和 newLine() 合并，防止缺失字段 (hOffset/vOffset 等)
  S.lines = JSON.parse(JSON.stringify(p.lines)).map(l=>Object.assign(newLine(),l));
  S.lineCount=p.lineCount;S.layout=p.layout;
  S.shape=p.shape||'polygon';
  if(p.shapeSides!==undefined)S.shapeSides=p.shapeSides;
  if(p.shapeStar!==undefined)S.shapeStar=p.shapeStar;
  S.radius=p.radius!==undefined?p.radius:0;
  // 旧 shape 迁移
  if(p.shape==='rect')S.shape='rounded-rect';
  else if(p.shape==='diamond'||p.shape==='pills')S.shape='polygon';
  else if(p.shape&&p.shape!=='circle'&&p.shape!=='polygon'&&p.shape!=='rounded-rect'){S.shape='none';}
  if(p.shape!==undefined && ['none','circle','polygon','rounded-rect'].includes(p.shape))S.shape=p.shape;
  if(p.direction!==undefined)S.direction=p.direction;else if(p.shapeAngle!==undefined)S.direction=p.shapeAngle;
  if(p.shapeSize!==undefined)S.shapeSize=p.shapeSize;
  if(p.shapeHStretch!==undefined)S.shapeHStretch=p.shapeHStretch;
  if(p.shapeVStretch!==undefined)S.shapeVStretch=p.shapeVStretch;
  if(p.shapeInner!==undefined)S.shapeInner=p.shapeInner;
  S.bg=JSON.parse(JSON.stringify(p.bg));
  S.currentLine=0;
  renderAll();draw();
  if(window.IK)window.IK.S=S;
}
const presetCanvases=[];
function drawPresets(){
  const pr=$('presetRow');
  if(pr.childElementCount!==PRESETS.length){
    pr.innerHTML='';
    PRESETS.forEach((p,idx)=>{
      const el=document.createElement('div');el.className='preset';el.title=p.name;
      const c=document.createElement('canvas');c.width=64;c.height=64;
      el.appendChild(c);
      el.onclick=()=>{applyPreset(p);document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));el.classList.add('active');};
      pr.appendChild(el);presetCanvases[idx]={el,c,cx:c.getContext('2d')};
    });
  }
  PRESETS.forEach((p,idx)=>{
    const{cx}=presetCanvases[idx];
    const saved=JSON.parse(JSON.stringify(S));
    S=JSON.parse(JSON.stringify(DEFAULTS));
    // Bug1 fix: 同样合并 newLine() 默认值
    S.lines = JSON.parse(JSON.stringify(p.lines)).map(l=>Object.assign(newLine(),l));
    S.lineCount=p.lineCount;S.layout=p.layout;S.shape=p.shape||'polygon';
    if(p.shapeSides!==undefined)S.shapeSides=p.shapeSides;
    if(p.shapeStar!==undefined)S.shapeStar=p.shapeStar;
    S.radius=p.radius!==undefined?p.radius:0;
    // 旧 shape 迁移
  if(p.shape==='rect')S.shape='rounded-rect';
  else if(p.shape==='diamond'||p.shape==='pills')S.shape='polygon';
  else if(p.shape&&p.shape!=='circle'&&p.shape!=='polygon'&&p.shape!=='rounded-rect'){S.shape='none';}
  if(p.shape!==undefined && ['none','circle','polygon','rounded-rect'].includes(p.shape))S.shape=p.shape;
  if(p.direction!==undefined)S.direction=p.direction;else if(p.shapeAngle!==undefined)S.direction=p.shapeAngle;
  if(p.shapeSize!==undefined)S.shapeSize=p.shapeSize;
  if(p.shapeHStretch!==undefined)S.shapeHStretch=p.shapeHStretch;
  if(p.shapeVStretch!==undefined)S.shapeVStretch=p.shapeVStretch;
  if(p.shapeInner!==undefined)S.shapeInner=p.shapeInner;
    S.bg=JSON.parse(JSON.stringify(p.bg));
    draw(cx,64);
    S=saved;
  });
}

function renderAll(){
  // sizeChips replaced by shapeSize slider in outer frame section
  buildShapeChips();updateShapeToggles();
  renderLineCount();renderLineTabs();renderLayoutGroup();
  ensureSegs(S.bg.numSegs);
  document.querySelectorAll('.fill-tab').forEach(x=>x.classList.toggle('active',+x.dataset.segn===S.bg.numSegs));
  drawSegGrid();renderSegEditor();
  renderStyleTabs();renderStylePanel();$('curLabel').textContent='· 行'+(S.currentLine+1);
  $('radius').value=S.radius;$('radiusV').textContent=S.radius+'%';
  $('shapeSize').value=S.shapeSize;$('shapeSizeV').textContent=S.shapeSize+'%';$('shapeSizeNum').value=S.shapeSize;$('shapeHS').value=S.shapeHStretch;$('shapeHSV').textContent=S.shapeHStretch+'%';$('shapeHSNum').value=S.shapeHStretch;$('shapeVS').value=S.shapeVStretch;$('shapeVSV').textContent=S.shapeVStretch+'%';$('shapeVSNum').value=S.shapeVStretch;$('radius').value=S.radius;$('radiusV').textContent=S.radius+'%';$('radiusNum').value=S.radius;$('direction').value=S.direction||0;$('directionV').textContent=(S.direction||0)+'°';$('directionNum').value=S.direction||0;$('shapeInner').value=S.shapeInner||0;$('shapeInnerV').textContent=(S.shapeInner||0)+'°';$('shapeInnerNum').value=S.shapeInner||0;
  $('splitAng').value=S.bg.angle;$('splitAngV').textContent=S.bg.angle+'°';
  $('borderOn').checked=S.border.on;$('borderBox').classList.toggle('hidden',!S.border.on);
  $('borderW').value=S.border.w;$('borderWV').textContent=S.border.w+'px';$('borderC').value=S.border.color;
  $('bgShadowOn').checked=S.bgShadow.on;$('bgShadowBox').classList.toggle('hidden',!S.bgShadow.on);
  $('bgShS').value=S.bgShadow.size||100;$('bgShSV').textContent=(S.bgShadow.size||100)+'%';if($('bgShSNum'))$('bgShSNum').value=S.bgShadow.size||100;$('bgShB').value=S.bgShadow.b;$('bgShBV').textContent=S.bgShadow.b+'px';$('bgShX').value=S.bgShadow.x;$('bgShXV').textContent=S.bgShadow.x+'px';
  $('bgShY').value=S.bgShadow.y;$('bgShYV').textContent=S.bgShadow.y+'px';$('bgShC').value=S.bgShadow.color;
  $('splitBd').value=S.bg.borderShape;$('transW').value=S.bg.transWidth;$('transWV').textContent=S.bg.transWidth+'px';
}

// DOWNLOAD
function exportName(ext,sz){
  const size=sz||S.size;
  const l0=(S.lines[0]&&S.lines[0].text)?S.lines[0].text.replace(/[\\/:*?"<>|]/g,'-').slice(0,20):(S.lines[0]&&S.lines[0].faIcon)?(S.lines[0].faIcon.slice(3)):'icon';
  const d=new Date();const pad=n=>String(n).padStart(2,'0');
  const ts=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  return `IconKing-${size}-${l0}-${ts}.${ext}`;
}
function exportCanvas(size,transparent){
  draw();
  if(size===S.size)return canvas;
  const oc=document.createElement('canvas');oc.width=oc.height=size;
  const o=oc.getContext('2d');
  o.imageSmoothingEnabled=true;o.imageSmoothingQuality='high';
  if(!transparent){o.fillStyle='#fff';o.fillRect(0,0,size,size);}
  o.drawImage(canvas,0,0,size,size);
  return oc;
}
function doDl(ext){
  const sz=parseInt($('dlSize').value)||S.size;
  const tr=!!$('dlTransparent').checked;
  const c=exportCanvas(sz,tr);
  const a=document.createElement('a');
  if(ext==='png'){a.href=c.toDataURL('image/png');}
  else if(ext==='jpg'){if(tr){const oc=document.createElement('canvas');oc.width=oc.height=sz;const o=oc.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,sz,sz);o.drawImage(c,0,0);a.href=oc.toDataURL('image/jpeg',0.92);}else a.href=c.toDataURL('image/jpeg',0.92);}
  else if(ext==='svg'){const s=S.size;const bg=S.bg.segments[0].solid||'#3a5580';const tx=(S.lines[0].text||'').replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));const b=new Blob([`<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 ${s} ${s}"><rect width="100%" height="100%" fill="${bg}"/><text x="${s/2}" y="${s/2}" text-anchor="middle" dominant-baseline="middle" font-family="Inter,Noto Sans SC" font-size="${s*(S.lines[0].size||65)/100}" font-weight="${S.lines[0].weight||700}" fill="${S.lines[0].color||'#fff'}">${tx}</text></svg>`],{type:'image/svg+xml'});const u=URL.createObjectURL(b);a.href=u;setTimeout(()=>URL.revokeObjectURL(u),1000);}
  else if(ext==='ico'){a.href=c.toDataURL('image/png');}
  a.download=exportName(ext,sz);a.click();
}
$('dlPng').onclick=()=>doDl('png');
$('dlJpg').onclick=()=>doDl('jpg');
$('dlSvg').onclick=()=>doDl('svg');
$('dlIco').onclick=()=>doDl('ico');
$('dlSize').oninput=e=>{const v=+e.target.value;$('dlSizeV').textContent=v+'px';$('dlSizeNum').value=v;};
$('dlSizeNum').oninput=e=>{let v=Math.max(16,Math.min(2048,+e.target.value||256));$('dlSize').value=Math.min(1024,v);$('dlSizeV').textContent=v+'px';};
$('presetExport').onclick=()=>{const d={version:1,exportAt:Date.now(),state:S};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`IconKing-preset-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
$('presetImport').onclick=()=>$('presetFile').click();
$('presetFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const txt=await f.text();const d=JSON.parse(txt);if(d.state){applyPreset(d.state);drawPresets();draw();alert('预设已加载');}}catch(err){alert('预设文件无效');}e.target.value='';};
$('btnReset').onclick=()=>{S=JSON.parse(JSON.stringify(DEFAULTS));renderAll();draw();drawPresets();document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));};

// THEME
document.querySelectorAll('.theme-btn').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.theme-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.documentElement.dataset.theme=b.dataset.t;S.theme=b.dataset.t;};
});

// INIT
document.documentElement.dataset.theme=S.theme;
// INIT：三重保险 —— 三个地方都尝试 renderAll+draw
const _initDraw = ()=>{try{renderAll();draw();}catch(e){console.error('init chain err:',e);try{draw();}catch(e2){}}};
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(_initDraw);}
else{_initDraw();}
window.addEventListener('load',()=>{setTimeout(_initDraw,400);});
window.addEventListener('load',()=>{setTimeout(()=>{try{drawPresets();}catch(e){console.error('drawPresets err:',e);}},500);});
window.IK={S,draw,DEFAULTS,applyPreset,drawPresets};
})();
</script>
