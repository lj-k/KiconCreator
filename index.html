<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KiconCreator · 版本导航</title>
<!-- 版本：V0.08 -->
<style>
:root{--bg:#eef1f7;--panel:#ffffff;--border:#e3e8f1;--text:#1d2333;--muted:#7c8698;--accent:#4d6ef5;--accent-2:#7c5cff;--soft:#eef2ff;--ok:#2fbf71}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text);background:var(--bg);background-image:radial-gradient(900px 380px at 12% -6%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%),radial-gradient(760px 340px at 92% 4%,color-mix(in srgb,var(--accent-2) 8%,transparent),transparent 70%);background-attachment:fixed}
.wrap{width:min(720px,92vw);padding:40px 0}
.head{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.logo{width:44px;height:44px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 42%,transparent)}
h1{margin:0;font-size:20px;letter-spacing:.2px}
.head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{position:relative;display:block;padding:20px 18px;background:var(--panel);border:1px solid var(--border);border-radius:14px;text-decoration:none;color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 22px rgba(16,24,40,.06);transition:.15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px rgba(16,24,40,.12)}
.card h2{margin:0 0 6px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.card .ver{display:inline-block;font-size:10.5px;font-weight:600;padding:1.5px 7px;border-radius:99px;background:var(--soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent)}
.card p{margin:0;font-size:12px;color:var(--muted);line-height:1.7}
.card .go{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--accent)}
.card.primary{border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.card.primary::after{content:"当前开发";position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;color:#fff;background:var(--ok);padding:2px 8px;border-radius:99px}
.foot{margin-top:24px;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <div class="logo">K</div>
    <div>
      <h1>KiconCreator · 图标王制作器</h1>
      <p>版本导航 · 零安装 · 纯浏览器运行 · by Kong</p>
    </div>
  </header>
  <section class="cards">
    <a class="card primary" href="V2/index.html">
      <h2>V2 · KiconCreator <span class="ver">V2.14</span></h2>
      <p>模块化架构（css/ + js/ + data/）· 文本与 FontAwesome 渲染 · 参数联动 · 撤销重做 · 预设历史 · 多格式导出</p>
      <span class="go">进入 V2 →</span>
    </a>
    <a class="card" href="V1/IconMaker.html">
      <h2>V1 · IconKing</h2>
      <p>初代单文件版本（存档）· 基础图标制作流程</p>
      <span class="go">进入 V1 →</span>
    </a>
  </section>
  <footer class="foot">FA6 图标字体已本地内嵌，离线可用 · 本页版本 V0.02</footer>
</main>
</body>
</html>
