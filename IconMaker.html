<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IconKing · 图标制作器</title>
<style>
#__lf{position:fixed;inset:0;z-index:9999;background:var(--lf-bg,#eef5ee);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s,visibility .35s}
#__lf.gone{opacity:0;visibility:hidden}
#__lf .t{font-family:'Menlo','Consolas',monospace;font-size:12px;color:var(--lf-text,#6b8e6b);letter-spacing:.18em;text-transform:uppercase}
#__lf .b{width:180px;height:2px;background:var(--lf-bar,#cbdccb);position:relative;overflow:hidden}
#__lf .f{position:absolute;inset:0;width:0;background:var(--lf-fg,#4f7a4f);transition:width .16s ease-out}
body.lf-lock{overflow:hidden}
</style>
<script>
(function(){var f,t,done=false;function s(v){if(f)f.style.width=v+'%'}function fin(){if(done)return;done=true;s(100);setTimeout(function(){var o=document.getElementById('__lf');if(o)o.classList.add('gone');document.body&&document.body.classList.remove('lf-lock')},220)}function w(){var o=document.getElementById('__lf');if(!o){setTimeout(w,16);return}f=o.querySelector('.f');document.body.classList.add('lf-lock');s(0);t=setInterval(function(){if(parseInt(f.style.width||'0')<60){s((parseInt(f.style.width||'0')+6)+'%')}else if(parseInt(f.style.width||'0')<85){s((parseInt(f.style.width||'0')+2)+'%')}else{s((parseInt(f.style.width||'0')+.8)+'%')}},160)}w();if(document.readyState==='complete')fin();else window.addEventListener('load',fin);setTimeout(fin,15000)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet" onerror="this.href='https://fonts.loli.net/css2?family=Inter:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css'">
<style>
:root,[data-theme="light"]{
  --lf-bg:#eef5ee;--lf-text:#6b8e6b;--lf-bar:#cbdccb;--lf-fg:#4f7a4f;
  --bg-page:#eef5ee;--bg-card:rgba(255,255,255,.85);--bg-card-solid:#ffffff;
  --bg-rail:#f4f9f4;--bg-input:#ffffff;--bg-hover:#e9f2e9;--bg-deep:#cbdccb;
  --border:rgba(120,140,120,.28);--border-strong:#b0c4b0;
  --accent:#4f7a4f;--accent-hover:#3d623d;
  --text:#2d472d;--text-sub:#6b8e6b;--text-muted:#99a899;--text-inv:#ffffff;
  --shadow:rgba(70,90,70,.15);
}
[data-theme="warm"]{
  --lf-bg:#f5ead0;--lf-text:#8a7a50;--lf-bar:#e4d6a8;--lf-fg:#a67c52;
  --bg-page:#f5ead0;--bg-card:rgba(250,240,210,.9);--bg-card-solid:#faf0d2;
  --bg-rail:#f0e4c4;--bg-input:#fdf6e4;--bg-hover:#e8dbb8;--bg-deep:#dccda0;
  --border:rgba(160,130,70,.3);--border-strong:#c4b48a;
  --accent:#a67c52;--accent-hover:#8a6542;
  --text:#3d2e15;--text-sub:#7a6e4a;--text-muted:#a89b78;--text-inv:#ffffff;
  --shadow:rgba(120,100,50,.18);
}
[data-theme="dark"]{
  --lf-bg:#1a1d1a;--lf-text:#9bb0a0;--lf-bar:#2d3a2d;--lf-fg:#6fa870;
  --bg-page:#1a1d1a;--bg-card:rgba(30,34,30,.9);--bg-card-solid:#222622;
  --bg-rail:#262b26;--bg-input:#2e342e;--bg-hover:#343b34;--bg-deep:#3a453a;
  --border:rgba(120,160,120,.25);--border-strong:#4a5a4a;
  --accent:#6fa870;--accent-hover:#85b886;
  --text:#e4ebe4;--text-sub:#9bb0a0;--text-muted:#6a7a6a;--text-inv:#1a1d1a;
  --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg-page);color:var(--text);font-family:'Noto Sans SC','Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;min-width:800px;min-height:400px;padding:10px;height:100vh;max-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr;min-width:0;height:auto;max-height:none;min-height:100vh;overflow-y:auto}}
.col{background:var(--bg-card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.col-hd{padding:9px 12px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-sub);display:flex;align-items:center;gap:7px;flex-shrink:0}
.col-hd i{font-size:11px;color:var(--accent)}
.col-bd{flex:1;overflow-y:auto;padding:12px}
.preview-center{display:flex;justify-content:center;margin:8px 0}
canvas#icon{border-radius:8px;box-shadow:0 4px 20px var(--shadow);background:#fff;max-width:100%}
.dl-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:6px 11px;border-radius:7px;cursor:pointer;border:1px solid var(--border-strong);background:var(--bg-card-solid);color:var(--text);transition:.12s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:var(--bg-hover)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--text-inv);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-sm{padding:4px 8px;font-size:10px}
.sec-t{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-sub);margin:10px 0 6px;display:flex;align-items:center;gap:5px}
.sec{margin-bottom:12px}.sec:last-child{margin-bottom:0}
/* ═══ PRESET — 严格 < 50px ═══ */
.preset-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:5px;justify-items:center}
.preset{width:48px;height:48px;max-width:48px;max-height:48px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:.12s;padding:2px;display:flex;align-items:center;justify-content:center}
.preset canvas{width:100%;height:100%;border-radius:5px}
.preset:hover{transform:translateY(-1px);box-shadow:0 2px 6px var(--shadow)}
.preset.active{border-color:var(--accent)}
.theme-row{display:flex;background:var(--bg-rail);border-radius:8px;padding:2px;margin-top:10px}
.theme-btn{flex:1;padding:6px;font-size:11px;text-align:center;border-radius:6px;cursor:pointer;color:var(--text-sub);font-family:'JetBrains Mono',monospace;transition:.12s;border:1px solid transparent}
.theme-btn.active{background:var(--bg-input);color:var(--accent);font-weight:600;border-color:var(--border-strong)}
.chip-row{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 9px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-card-solid);cursor:pointer;font-size:11px;color:var(--text-sub);transition:.12s;font-family:'JetBrains Mono',monospace}
.chip:hover{background:var(--bg-hover);color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ═══ LINE TABS — mode + 输入 二合一 ═══ */
.line-tabs{display:flex;background:var(--bg-rail);border-radius:8px;padding:2px;margin-bottom:6px;flex-wrap:wrap;gap:2px}
.line-tab{padding:2px;border-radius:6px;border:1px solid transparent;transition:.12s;display:flex;align-items:center;gap:4px;position:relative}
/* Bug3 fix: mode span 不能冒泡, z-index 更高 */
.line-tab .mode{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;font-size:10px;color:#fff;font-family:'JetBrains Mono',monospace;font-weight:700;cursor:pointer;transition:.12s;user-select:none;flex-shrink:0;position:relative;z-index:2}
.line-tab .mode.tmd{background:#4f7a4f}
.line-tab .mode.imd{background:#3a6eaa}
.line-tab .mode.fmd{background:#a64f3a}
.line-tab .mode:hover{transform:scale(1.1)}
.line-tab input{padding:4px 6px;border-radius:4px;border:none;background:transparent;font-size:12px;font-family:'Noto Sans SC','Inter',sans-serif;color:var(--text);outline:none;text-align:center;min-width:40px;max-width:120px}
.line-tab input::placeholder{color:var(--text-muted)}
.line-tab select.fa-sel{padding:3px 5px;border-radius:4px;border:1px solid var(--border-strong);background:var(--bg-input);font-size:11px;color:var(--text);min-width:80px}
.line-tab.active{background:var(--bg-input);border-color:var(--border-strong);box-shadow:0 2px 5px var(--shadow)}
.layout-group{display:flex;flex-wrap:wrap;gap:5px}
.layout-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-card-solid);cursor:pointer;font-size:11px;color:var(--text-sub);transition:.12s;font-family:'Noto Sans SC','Inter',sans-serif}
.layout-btn:hover{background:var(--bg-hover);color:var(--accent)}
.layout-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.style-tabs{display:flex;background:var(--bg-rail);border-radius:8px;padding:2px;margin-bottom:6px;flex-wrap:wrap}
.style-tab{padding:5px 10px;font-size:11px;border-radius:5px;cursor:pointer;color:var(--text-sub);font-family:'JetBrains Mono',monospace;transition:.12s;border:1px solid transparent}
.style-tab.active{background:var(--bg-input);color:var(--accent);font-weight:600;border-color:var(--border-strong)}
.form-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.form-row .lbl{font-size:11px;color:var(--text-sub);min-width:48px;font-family:'JetBrains Mono',monospace}
.form-row select,.form-row input[type="text"]{flex:1;padding:5px 8px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-input);font-size:12px;color:var(--text)}
.form-row select:focus,.form-row input[type="text"]:focus{outline:none;border-color:var(--accent)}
.form-row input[type="color"]{width:32px;height:26px;padding:0;border-radius:5px;border:1px solid var(--border-strong);background:var(--bg-input);cursor:pointer}
.form-row .v{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-sub);min-width:36px;text-align:right}
.form-row input[type="range"]{flex:1;-webkit-appearance:none;height:4px;background:var(--bg-deep);border-radius:4px}
.form-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-input);cursor:pointer}
.fill-tabs{display:flex;background:var(--bg-rail);border-radius:8px;padding:2px;margin-bottom:8px}
.fill-tab{flex:1;padding:7px 4px;font-size:10px;text-align:center;border-radius:6px;cursor:pointer;color:var(--text-sub);font-family:'JetBrains Mono',monospace;transition:.12s;border:1px solid transparent;letter-spacing:.06em}
.fill-tab.active{background:var(--bg-input);color:var(--accent);font-weight:600;border-color:var(--border-strong)}
.seg-grid{display:flex;gap:5px;margin-bottom:8px}
.seg-item{flex:1;max-width:25%;aspect-ratio:1;border-radius:6px;cursor:pointer;border:2px solid transparent;overflow:hidden;position:relative;transition:.12s;min-width:32px}
.seg-item:hover{transform:translateY(-1px);box-shadow:0 2px 6px var(--shadow)}
.seg-item.active{border-color:var(--accent)}
.seg-item canvas{width:100%;height:100%;display:block}
.seg-item .seg-idx{position:absolute;bottom:1px;right:2px;font-family:'JetBrains Mono',monospace;font-size:9px;color:#fff;background:rgba(0,0,0,.4);padding:0 3px;border-radius:3px}
.seg-mode-tabs{display:flex;background:var(--bg-rail);border-radius:6px;padding:2px;margin-bottom:8px}
.seg-mode-tab{flex:1;padding:5px 4px;font-size:10px;text-align:center;border-radius:4px;cursor:pointer;color:var(--text-sub);font-family:'JetBrains Mono',monospace;border:1px solid transparent}
.seg-mode-tab.active{background:var(--bg-input);color:var(--accent);font-weight:600;border-color:var(--border-strong)}
.bd-tabs{display:flex;background:var(--bg-rail);border-radius:8px;padding:2px;margin-bottom:8px}
.bd-tab{flex:1;padding:7px 4px;font-size:10px;text-align:center;border-radius:6px;cursor:pointer;color:var(--text-sub);font-family:'JetBrains Mono',monospace;border:1px solid transparent;letter-spacing:.06em}
.bd-tab.active{background:var(--bg-input);color:var(--accent);font-weight:600;border-color:var(--border-strong)}
.dropzone{border:2px dashed var(--border-strong);border-radius:8px;padding:10px;text-align:center;background:var(--bg-rail);cursor:pointer;font-size:11px;color:var(--text-sub);transition:.12s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--bg-hover)}
.hidden{display:none!important}
.check{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-card-solid);font-size:11px;color:var(--text-sub);cursor:pointer}
.check input{margin:0;accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
.suggest-row{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.suggest-chip{width:20px;height:20px;border-radius:4px;cursor:pointer;border:1px solid var(--border-strong);transition:.1s;position:relative}
.suggest-chip:hover{transform:scale(1.15)}
.suggest-chip::after{content:attr(title);position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff;background:rgba(0,0,0,.7);padding:2px 4px;border-radius:3px;white-space:nowrap;opacity:0;pointer-events:none}
.suggest-chip:hover::after{opacity:1}
/* FA 分类面板 */
.fa-tree{max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;background:var(--bg-card-solid)}
.fa-tree .fa-grp{border-bottom:1px solid var(--border);padding:4px 6px}
.fa-tree .fa-grp:last-child{border-bottom:none}
.fa-tree .fa-grp-t{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-bottom:3px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.fa-tree .fa-grp-t .caret{transition:.2s}
.fa-tree .fa-grp.collapsed .caret{transform:rotate(-90deg)}
.fa-tree .fa-grp.collapsed .fa-grid{display:none}
.fa-tree .fa-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.fa-tree .fa-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;color:var(--text-sub);font-size:12px;transition:.1s}
.fa-tree .fa-ic:hover{background:var(--bg-hover);color:var(--accent)}
.fa-tree .fa-ic.selected{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="__lf" aria-hidden="true"></div>
<div class="app">
  <!-- ═══ LEFT: PREVIEW + PRESETS + DL + THEME ═══ -->
  <section class="col">
    <div class="col-hd"><i class="fa-solid fa-eye"></i>预览 · 预设 · 导出</div>
    <div class="col-bd">
      <div class="preview-center">
        <canvas id="icon" width="256" height="256" style="width:220px;height:220px;display:block"></canvas>
      </div>
      <div class="dl-row">
        <button id="dlPng" class="btn btn-primary"><i class="fa-solid fa-download"></i>PNG</button>
        <button id="dlJpg" class="btn"><i class="fa-solid fa-download"></i>JPEG</button>
        <button id="dlSvg" class="btn"><i class="fa-solid fa-code"></i>SVG</button>
        <button id="btnReset" class="btn btn-sm"><i class="fa-solid fa-rotate-left"></i>重置</button>
      </div>
      <div class="sec-t"><i class="fa-solid fa-wand-sparkles"></i>预设（canvas 真实渲染 <50px）</div>
      <div class="preset-row" id="presetRow"></div>
      <div class="sec-t"><i class="fa-solid fa-palette"></i>界面主题</div>
      <div class="theme-row">
        <div class="theme-btn active" data-t="light"><i class="fa-solid fa-sun"></i> 明亮</div>
        <div class="theme-btn" data-t="warm"><i class="fa-solid fa-mug-hot"></i> 复古</div>
        <div class="theme-btn" data-t="dark"><i class="fa-solid fa-moon"></i> 暗黑</div>
      </div>
    </div>
  </section>

  <!-- ═══ MIDDLE: CONTENT PARAMS ═══ -->
  <section class="col">
    <div class="col-hd"><i class="fa-solid fa-font"></i>内容参数</div>
    <div class="col-bd">
      <div class="sec">
        <div class="sec-t"><i class="fa-solid fa-list-ol"></i>文本行数</div>
        <div class="chip-row" id="lineCountChips"></div>
      </div>
      <div class="sec">
        <div class="sec-t"><i class="fa-solid fa-table-cells-large"></i>排版模式</div>
        <div class="layout-group" id="layoutGroup"></div>
      </div>
      <div class="sec">
        <div class="sec-t"><i class="fa-solid fa-pen"></i>各行（模式 + 输入 二合一）</div>
        <div class="line-tabs" id="lineTabs"></div>
      </div>
      <div class="sec">
        <div class="sec-t"><i class="fa-solid fa-sliders"></i>当前行样式 <span id="curLabel" style="font-size:10px;color:var(--accent);font-family:'JetBrains Mono',monospace">· 行1</span></div>
        <div class="style-tabs" id="styleTabs"></div>
        <div id="stylePanel"></div>
      </div>
    </div>
  </section>

  <!-- ═══ RIGHT: BG PARAMS — 重划三大区 ═══ -->
  <section class="col">
    <div class="col-hd"><i class="fa-solid fa-palette"></i>背景参数</div>
    <div class="col-bd">

      <!-- ① 外框功能区 -->
      <div class="sec">
        <div class="sec-t"><i class="fa-solid fa-ruler-combined"></i>尺寸</div>
        <div class="chip-row" id="sizeChips"></div>
        <div class="sec-t"><i class="fa-solid fa-shapes"></i>形状</div>
        <div class="chip-row" id="shapeChips"></div>
        <div class="form-row" id="radiusWrap" style="margin-top:6px">
          <div class="lbl">弧度</div>
          <input type="range" id="radius" min="0" max="100" value="0">
          <span class="v" id="radiusV">0%</span>
        </div>
        <div class="form-row" id="angleWrap">
          <div class="lbl">角度</div>
          <input type="range" id="shapeAngle" min="0" max="360" value="0">
          <span class="v" id="shapeAngleV">0°</span>
        </div>
      </div>

      <!-- ② 填充布局 & 边界 -->
      <div class="sec" id="splitLayoutSec">
        <div class="sec-t"><i class="fa-solid fa-object-group"></i>② 填充布局</div>
        <div class="form-row"><div class="lbl">角度</div><input type="range" id="splitAng" min="0" max="360" value="0"><span class="v" id="splitAngV">0°</span></div>
        <div id="splitRatios"></div>
        <div class="form-row"><div class="lbl">边界</div>
          <select id="splitBd"><option value="line">直线</option><option value="curve">曲线</option></select>
        </div>
        <div class="chip-row" id="transModeGroup" style="margin-top:4px"></div>
        <div class="form-row" style="margin-top:4px"><div class="lbl">过渡宽</div><input type="range" id="transW" min="0" max="30" value="0"><span class="v" id="transWV">0px</span></div>
      </div>

      <!-- ③ 内部填充 -->
      <div class="sec">
        <div class="sec-t"><i class="fa-solid fa-fill-drip"></i>③ 内部填充</div>
        <div class="fill-tabs">
          <div class="fill-tab active" data-segn="1">单色</div>
          <div class="fill-tab" data-segn="2">二分</div>
          <div class="fill-tab" data-segn="3">三分</div>
          <div class="fill-tab" data-segn="4">四分</div>
        </div>
        <div class="seg-grid" id="segGrid"></div>
        <div id="segEditor">
          <div class="seg-mode-tabs">
            <div class="seg-mode-tab active" data-smode="solid">纯色</div>
            <div class="seg-mode-tab" data-smode="gradient">渐变</div>
            <div class="seg-mode-tab" data-smode="image">图片</div>
          </div>
          <div id="segSolid">
            <div class="form-row"><div class="lbl">颜色</div><input type="color" id="segSolidColor" value="#4f7a4f"></div>
            <div class="form-row"><div class="lbl">建议</div><div class="suggest-row" id="segSolidSug"></div></div>
          </div>
          <div id="segGrad" class="hidden">
            <div class="form-row"><div class="lbl">起始</div><input type="color" id="segGradS" value="#4f7a4f"></div>
            <div class="form-row"><div class="lbl">终止</div><input type="color" id="segGradE" value="#1d3a2a"></div>
            <div class="chip-row" id="segGradType" style="margin-top:4px"></div>

            <div class="form-row" style="margin-top:6px"><div class="lbl">缩放</div><input type="range" id="segImgScale" min="10" max="200" value="100"><span class="v" id="segImgScaleV">100%</span></div>

      <!-- 边框 & 背景阴影 -->

            <div class="form-row"><div class="lbl">Y</div><input type="range" id="bgShY" min="-20" max="20" value="3"><span class="v" id="bgShYV">3px</span></div>

        <div class="sec-t"><i class="fa-solid fa-sliders"></i>高级选项</div>

      </div>

    </div>

</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('icon'), ctx=canvas.getContext('2d');

// ═══════ COLOR UTILS ═══════
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return{r,g,b}}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v|0)).toString(16).padStart(2,'0')).join('')}
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(Math.min(k(n)-3,9-k(n)),1));return rgbToHex(f(0)*255,f(8)*255,f(4)*255)}
function hexToHsl(h){const{r,g,b}=hexToRgb(h);const rn=r/256,gn=g/256,bn=b/256;const mx=Math.max(rn,gn,bn),mn=Math.min(rn,gn,bn);let hh,s;const l=(mx+mn)/2;if(mx===mn){hh=0;s=0}else{const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=(mx===rn?(gn-bn)/(d+(gn<bn?6:0)):mx===gn?(bn-rn)/(d+2):(rn-gn)/(d+4))*60}return{h:hh,s:s*100,l:l*100}}
function colorSuggestions(hex){
  const H=hexToHsl(hex);
  return {
    complement:hslToHex((H.h+180)%360,H.s,H.l),
    analogous:hslToHex((H.h+30)%360,H.s,H.l),
    soft:hslToHex(H.h,Math.max(30,H.s*0.55),Math.min(75,H.l*1.15)),
    bright:hslToHex(H.h,Math.min(100,H.s*1.3),Math.min(85,H.l+15))
  };
}

// ═══════ DEFAULTS ═══════
function newSegment(){return{mode:'solid',solid:'#4f7a4f',gradient:{start:'#4f7a4f',end:'#1d3a2a',type:'linear',angle:135},image:{url:null,scale:100,pos:'center'}};}
function newLine(){return{mode:'text',text:'A',font:'Inter',zhFont:'Noto Sans SC',weight:'700',size:65,color:'#ffffff',hStretch:100,vStretch:100,hOffset:0,vOffset:0,shadow:{on:false,blur:6,x:0,y:2,color:'#000000'},fillMode:'solid',fillGradS:'#ffffff',fillGradE:'#dddddd',imgUrl:null,imgScale:100,imgPos:'center',faIcon:'fa-star',faColor:'#ffffff',faSize:65};}

const DEFAULTS={
  lines:[newLine()],lineCount:1,currentLine:0,layout:'h-center',
  size:256,shape:'polygon',shapeSides:4,shapeStar:false,radius:0,shapeAngle:0,
  bg:{segments:[newSegment()],numSegs:1,angle:0,ratios:[],borderShape:'line',transMode:'none',transWidth:0},
  border:{on:false,w:3,color:'#ffffff'},
  bgShadow:{on:false,b:8,x:0,y:3,color:'#000000'},
  transparentBg:false,theme:'light'
};
let S=JSON.parse(JSON.stringify(DEFAULTS));

// roundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number')r={tl:r,tr:r,br:r,bl:r};
    this.beginPath();this.moveTo(x+r.tl,y);this.lineTo(x+w-r.tr,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r.tr);this.lineTo(x+w,y+h-r.br);
    this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);this.lineTo(x+r.bl,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r.bl);this.lineTo(x,y+r.tl);
    this.quadraticCurveTo(x,y,x+r.tl,y);this.closePath();
  };
}

// ═══════ SHAPE PATH — 扩展 N 边形 + 角星 ═══════
function shapePath(c,size){
  c.beginPath();
  const m=Math.max(2,Math.round(size*0.02));
  const cx=size/2,cy=size/2;
  if(S.shape==='circle'){ c.arc(cx,cy,size/2-m,0,Math.PI*2); }
  else if(S.shape==='rect'){ c.rect(m,m,size-m*2,size-m*2); }
  else if(S.shape==='pills'){
    const x=m,y=m,w=size-m*2,h=size-m*2,r=h/2;
    c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arc(x+w-r,y+r,r,-Math.PI/2,Math.PI/2);
    c.lineTo(x+r,y+h);c.arc(x+r,y+r,r,Math.PI/2,-Math.PI/2);c.closePath();
  } else if(S.shape==='diamond'){
    c.moveTo(cx,cy-size/2+m);c.lineTo(size-m,cy);c.lineTo(cx,cy+size/2-m);c.lineTo(m,cy);c.closePath();
  } else if(S.shape==='polygon'){
    const n=S.shapeSides||4, rOut=size*0.48, rIn=rOut*(S.shapeStar?0.4:1);
    const rot=(S.shapeAngle||0)*Math.PI/180 - Math.PI/2;
    const pts=[];
    if(S.shapeStar){
      for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n;pts.push([cx+Math.cos(a)*(i%2===0?rOut:rIn),cy+Math.sin(a)*(i%2===0?rOut:rIn)]);}
    } else {
      for(let i=0;i<n;i++){const a=rot+i*Math.PI*2/n;pts.push([cx+Math.cos(a)*rOut,cy+Math.sin(a)*rOut]);}
    }
    // 弧度倒角
    if(S.radius>0){
      const r0=Math.min(size*S.radius/200, size*0.06);
      c.moveTo(pts[0][0],pts[0][1]);
      for(let i=0;i<pts.length;i++){
        const p1=pts[i],p2=pts[(i+1)%pts.length],p3=pts[(i+2)%pts.length];
        const ang1=Math.atan2(p1[1]-p2[1],p1[0]-p2[0]);
        const ang2=Math.atan2(p3[1]-p2[1],p3[0]-p2[0]);
        const d1=Math.hypot(p1[0]-p2[0],p1[1]-p2[1]);
        const d2=Math.hypot(p3[0]-p2[0],p3[1]-p2[1]);
        const k=Math.min(r0/(d1/2||1),r0/(d2/2||1),1);
        const qa=[p2[0]+Math.cos(ang1)*d1*k,p2[1]+Math.sin(ang1)*d1*k];
        const qb=[p2[0]+Math.cos(ang2)*d2*k,p2[1]+Math.sin(ang2)*d2*k];
        c.lineTo(qa[0],qa[1]);
        c.quadraticCurveTo(p2[0],p2[1],qb[0],qb[1]);
      }
      c.closePath();
    } else {
      pts.forEach(([x,y],i)=>{c[i?'lineTo':'moveTo'](x,y);});
      c.closePath();
    }
  }
}

// ═══════ FILL SEGMENT ═══════
function fillSegment(c,seg,x,y,w,h){
  if(seg.mode==='solid'){ c.fillStyle=seg.solid; c.fillRect(x,y,w,h); }
  else if(seg.mode==='gradient'){
    let g;
    if(seg.gradient.type==='radial') g=c.createRadialGradient(x+w/2,y+h/2,0,x+w/2,y+h/2,Math.max(w,h)/2);
    else g=c.createLinearGradient(x,y,x+Math.cos(seg.gradient.angle*Math.PI/180)*w,y+Math.sin(seg.gradient.angle*Math.PI/180)*h);
    g.addColorStop(0,seg.gradient.start);g.addColorStop(1,seg.gradient.end);
    c.fillStyle=g;c.fillRect(x,y,w,h);
  } else if(seg.mode==='image' && seg.image.url){
    const img=seg._img||(seg._img=new Image());
    if(img.src!==seg.image.url){img.onload=()=>{};img.src=seg.image.url;}
    if(img.complete&&img.naturalWidth>0){
      const s=seg.image.scale/100,r=Math.min(w/img.width,h/img.height),dw=img.width*r*s,dh=img.height*r*s;
      let dy=y+h/2-dh/2;
      if(seg.image.pos==='top')dy=y;if(seg.image.pos==='bottom')dy=y+h-dh;
      c.drawImage(img,x+w/2-dw/2,dy,dw,dh);
    } else c.fillStyle='#eee',c.fillRect(x,y,w,h);
  }
}

// ═══════ DRAW BG ═══════
function drawBg(c,size){
  shapePath(c,size);c.clip();
  const m=Math.max(2,Math.round(size*0.02));
  const x=m,y=m,w=size-m*2,h=size-m*2;
  const segs=S.bg.segments;
  if(segs.length===1){fillSegment(c,segs[0],x,y,w,h);return;}
  const cx=x+w/2,cy=y+h/2,ang=S.bg.angle*Math.PI/180;
  c.save();c.translate(cx,cy);c.rotate(ang);c.translate(-cx,-cy);
  if(segs.length===2){
    fillSegment(c,segs[0],x,y,w,h/2);fillSegment(c,segs[1],x,y+h/2,w,h/2);
  } else if(segs.length===3){
    const topR=S.bg.ratios[0]!==undefined?S.bg.ratios[0]/100:0.5;
    fillSegment(c,segs[0],x,y,w,h*topR);
    fillSegment(c,segs[1],x,y+h*topR,w/2,h*(1-topR));
    fillSegment(c,segs[2],x+w/2,y+h*topR,w/2,h*(1-topR));
  } else if(segs.length===4){
    fillSegment(c,segs[0],x,y,w/2,h/2);fillSegment(c,segs[1],x+w/2,y,w/2,h/2);
    fillSegment(c,segs[2],x,y+h/2,w/2,h/2);fillSegment(c,segs[3],x+w/2,y+h/2,w/2,h/2);
  }
  c.restore();
}

function drawShapeOuter(c,size){
  if(S.bgShadow&&S.bgShadow.on){
    c.save();
    c.shadowColor=(S.bgShadow.color||'#000000')+'73';
    c.shadowBlur=Math.round((S.bgShadow.b||8)*size/256);
    c.shadowOffsetX=Math.round((S.bgShadow.x||0)*size/256);
    c.shadowOffsetY=Math.round((S.bgShadow.y||3)*size/256);
    shapePath(c,size);c.fillStyle='rgba(0,0,0,.01)';c.fill();
    c.restore();
  }
  if(S.border&&S.border.on){
    shapePath(c,size);
    c.lineWidth=Math.round((S.border.w||3)*size/256);
    c.strokeStyle=S.border.color||'#ffffff';
    c.stroke();
  }
}

// ═══════ LAYOUT ═══════
function computeLayout(lc,layout,size){
  const cx=size/2,cy=size/2,m=size*0.14,W=size-m*2,H=size-m*2,pos=[];
  if(lc===1){
    if(layout==='h-top')pos.push([cx,m+H*0.18]);else if(layout==='h-bottom')pos.push([cx,m+H*0.82]);
    else if(layout==='v-left')pos.push([m+W*0.18,cy]);else if(layout==='v-right')pos.push([m+W*0.82,cy]);
    else pos.push([cx,cy]);
  } else if(lc===2){
    if(layout==='v-top-bot'){pos.push([cx,cy-H*0.22]);pos.push([cx,cy+H*0.22])}
    else{pos.push([cx-W*0.22,cy]);pos.push([cx+W*0.22,cy])}
  } else if(lc===3){
    if(layout==='t-inverted'){pos.push([cx,cy+H*0.28]);pos.push([cx-W*0.25,cy-H*0.12]);pos.push([cx+W*0.25,cy-H*0.12])}
    else{pos.push([cx,cy-H*0.28]);pos.push([cx-W*0.25,cy+H*0.12]);pos.push([cx+W*0.25,cy+H*0.12])}
  } else if(lc===4){
    if(layout==='l-121'){pos.push([cx,cy-H*0.30]);pos.push([cx-W*0.25,cy]);pos.push([cx+W*0.25,cy]);pos.push([cx,cy+H*0.30])}
    else{pos.push([cx-W*0.25,cy-H*0.25]);pos.push([cx+W*0.25,cy-H*0.25]);pos.push([cx-W*0.25,cy+H*0.25]);pos.push([cx+W*0.25,cy+H*0.25])}
  }
  return pos;
}

// ═══════ DRAW CONTENT — Bug4 fix: 渐变离屏 canvas 修复 ═══════
function drawContent(c,size){
  const pos=computeLayout(S.lineCount,S.layout,size);
  pos.forEach((p,i)=>{
    const line=S.lines[i];if(!line)return;
    const cx=p[0],cy=p[1];
    // shadow
    let hasShadow=false;
    if(line.shadow&&line.shadow.on){
      c.save();
      c.shadowColor=line.shadow.color;
      c.shadowBlur=Math.round(line.shadow.blur*size/256);
      c.shadowOffsetX=Math.round(line.shadow.x*size/256);
      c.shadowOffsetY=Math.round(line.shadow.y*size/256);
      hasShadow=true;
    }
    if(line.mode==='text'){
      const hasCJK=/[\u4e00-\u9fff]/.test(line.text);
      const fam=hasCJK?line.zhFont:line.font;
      let fs=size*line.size/100;
      c.textAlign='center';c.textBaseline='middle';
      c.font=`${line.weight} ${fs}px "${fam}", sans-serif`;
      // auto fit
      const maxW=size*0.72,a=0;
      while(c.measureText(line.text).width>maxW&&fs>6&&a<80){fs-=2;c.font=`${line.weight} ${fs}px "${fam}", sans-serif`;a++}
      // Bug4 fix: 渐变填充 —— 正确的 source-in 顺序
      if(line.fillMode==='gradient'&&line.text){
        const w=c.measureText(line.text).width;
        // 1) 画离屏 canvas: 黑色形状（蒙版）
        const oc=document.createElement('canvas');
        oc.width=Math.ceil(w)+4;oc.height=Math.ceil(fs*1.4)+4;
        const ocx=oc.getContext('2d');
        ocx.font=c.font;ocx.textAlign='center';ocx.textBaseline='middle';
        ocx.fillStyle='#000';
        ocx.fillText(line.text,oc.width/2,oc.height/2);
        // 2) 在主 canvas: 画渐变，用 globalCompositeOperation='destination-in' 让渐变只留形状区
        // 简单做法：先画文字用纯色（已带 shadow save），然后用 source-atop
        c.save();
        c.translate(cx,cy);
        c.scale(line.hStretch/100,line.vStretch/100);
        c.translate(line.hOffset*size/256,line.vOffset*size/256);
        const g=c.createLinearGradient(-w/2,0,w/2,0);
        g.addColorStop(0,line.fillGradS);g.addColorStop(1,line.fillGradE);
        // 先画离屏 canvas 的字形状到主 canvas，设 source-in
        c.globalCompositeOperation='source-over';
        c.drawImage(oc,-oc.width/2,-oc.height/2);
        c.globalCompositeOperation='source-in';
        c.fillStyle=g;c.fillRect(-w/2-2,-fs,w+4,fs*2);
        c.globalCompositeOperation='source-over';
        c.restore();
      } else {
        c.save();c.translate(cx,cy);c.scale(line.hStretch/100,line.vStretch/100);
        c.fillStyle=line.color;
        c.fillText(line.text,line.hOffset*size/256,line.vOffset*size/256);
        c.restore();
      }
    } else if(line.mode==='fa'){
      const FA_MAP={'fa-star':'\uf005','fa-heart':'\uf004','fa-check':'\uf00c','fa-plus':'\uf067','fa-search':'\uf002','fa-home':'\uf015','fa-cog':'\uf013','fa-bell':'\uf0f3','fa-user':'\uf007','fa-camera':'\uf030','fa-gift':'\uf06b','fa-rocket':'\uf135','fa-fire':'\uf06d','fa-bolt':'\uf0e7','fa-cloud':'\uf0c2','fa-leaf':'\uf06c','fa-sun':'\uf185','fa-moon':'\uf186','fa-code':'\uf121','fa-wifi':'\uf1eb','fa-music':'\uf001','fa-flag':'\uf024','fa-thumbs-up':'\uf164','fa-heart-pulse':'\uf21e','fa-shield':'\uf132','fa-lock':'\uf023','fa-key':'\uf084','fa-envelope':'\uf0e0','fa-phone':'\uf095','fa-map-marker':'\uf041','fa-car':'\uf1b9','fa-plane':'\uf072','fa-compass':'\uf14e','fa-bicycle':'\uf206','fa-dog':'\uf06d','fa-cat':'\uf19b','fa-paw':'\uf1b0','fa-dice':'\uf522','fa-chess-king':'\uf43f'};
      const glyph=FA_MAP[line.faIcon]||'★';
      let fs=size*(line.faSize||65)/100;
      c.textAlign='center';c.textBaseline='middle';
      c.save();c.translate(cx,cy);
      c.font=`${fs}px "Font Awesome 6 Free","FontAwesome","Inter",sans-serif`;
      c.fillStyle=line.faColor||'#fff';
      c.fillText(glyph,0,0);
      c.restore();
    } else if(line.mode==='image'&&line.imgUrl){
      const img=line._img||(line._img=new Image());
      if(img.src!==line.imgUrl){img.onload=()=>{line._needsRedraw=true;};img.src=line.imgUrl;}
      if(img.complete&&img.naturalWidth>0){
        const s=(line.imgScale||100)/100,r=Math.min(size*0.7/img.width,size*0.4/img.height),dw=img.width*r*s,dh=img.height*r*s;
        c.drawImage(img,cx-dw/2,cy-dh/2,dw,dh);
      } else {c.fillStyle='#aaa';c.fillRect(cx-20,cy-20,40,40);}
    }
    if(hasShadow)c.restore();
  });
}

// ═══════ MAIN DRAW ═══════
function draw(cc,sz){
  const c=cc||ctx,size=sz||S.size;
  if(cc===undefined&&sz===undefined){canvas.width=size;canvas.height=size;c.clearRect(0,0,size,size);}
  else{c.clearRect(0,0,size,size);}
  drawBg(c,size);
  drawShapeOuter(c,size);
  drawContent(c,size);
  // Bug1 fix: transparentBg —— 只把近白色像素换成透明，不是整个背景消失
  if(S.transparentBg){
    const d=c.getImageData(0,0,size,size);
    const data=d.data;const tol=30;
    for(let i=0;i<data.length;i+=4){
      const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      if(a>0 && r>=255-tol && g>=255-tol && b>=255-tol){
        data[i+3]=0;
      }
    }
    c.putImageData(d,0,0);
  }
}

// ═══════ UI RENDER ═══════
function buildChips(id,items,key){
  const el=$(id);if(!el)return;el.innerHTML='';
  const cur = key.includes('.')?(()=>{const p=key.split('.');return S[p[0]][p[1]];})():S[key];
  items.forEach(([v,l])=>{
    const d=document.createElement('div');
    d.className='chip'+(String(cur)===String(v)?' active':'');
    d.textContent=l;
    d.onclick=()=>{
      if(key.includes('.')){const p=key.split('.');S[p[0]][p[1]]=typeof v==='string'?v:parseInt(v,10);}
      else{S[key]=typeof v==='string'?v:parseInt(v,10);}
      buildChips(id,items,key);draw();
    };
    el.appendChild(d);
  });
}

function buildShapeChips(){
  const el=$('shapeChips');el.innerHTML='';
  const groups=[
    {label:'基础',items:[['circle','圆'],['rect','直角方'],['diamond','菱形'],['pills','胶囊']]},
    {label:'多边形',items:[['p3','3边'],['p4','4边'],['p5','5边'],['p6','6边'],['p8','8边']]},
    {label:'角星',items:[['s3','★3'],['s4','★4'],['s5','★5'],['s6','★6'],['s8','★8']]},
  ];
  groups.forEach(g=>{
    const t=document.createElement('div');t.style.cssText='font-size:10px;color:var(--text-muted);margin:4px 0 2px;font-family:"JetBrains Mono",monospace';t.textContent=g.label;
    el.appendChild(t);
    const row=document.createElement('div');row.className='chip-row';
    g.items.forEach(([v,l])=>{
      const d=document.createElement('div');
      d.className='chip'+(matchShape(v)?' active':'');
      d.textContent=l;
      d.onclick=()=>{setShape(v);buildShapeChips();updateShapeToggles();draw();};
      row.appendChild(d);
    });
    el.appendChild(row);
  });
}
function matchShape(v){
  if(v==='circle')return S.shape==='circle';
  if(v==='rect')return S.shape==='rect';
  if(v==='diamond')return S.shape==='diamond';
  if(v==='pills')return S.shape==='pills';
  if(v.startsWith('p'))return S.shape==='polygon'&&!S.shapeStar&&S.shapeSides===+v.slice(1);
  if(v.startsWith('s'))return S.shape==='polygon'&&S.shapeStar&&S.shapeSides===+v.slice(1);
  return false;
}
function setShape(v){
  if(v==='circle')S.shape='circle';
  else if(v==='rect')S.shape='rect';
  else if(v==='diamond')S.shape='diamond';
  else if(v==='pills')S.shape='pills';
  else{S.shape='polygon';S.shapeStar=v.startsWith('s');S.shapeSides=+v.slice(1);}
  updateShapeToggles();
}
function updateShapeToggles(){
  const needRad=S.shape==='polygon'||S.shape==='rect'||S.shape==='diamond'||S.shape==='pills';
  const needAng=S.shape==='polygon';
  $('radiusWrap').style.display=needRad?'':'none';
  $('angleWrap').style.display=needAng?'':'none';
}

// 行 Tab — Bug3 fix: mode span 独立容器阻止冒泡
function renderLineTabs(){
  const c=$('lineTabs');c.innerHTML='';
  for(let i=0;i<S.lineCount;i++){
    const line=S.lines[i];
    const tab=document.createElement('div');
    tab.className='line-tab'+(S.currentLine===i?' active':'');
    // mode 徽标 —— 独立 span，pointer-events 单独处理
    const modeSpan=document.createElement('span');
    modeSpan.className='mode '+(line.mode==='text'?'tmd':line.mode==='image'?'imd':'fmd');
    modeSpan.textContent=line.mode==='text'?'文':line.mode==='image'?'图':'F';
    modeSpan.title='点击切换内容模式';
    // Bug3 fix: 直接在 modeSpan 上绑定 click，并 stopPropagation
    modeSpan.addEventListener('click',(e)=>{
      e.stopPropagation();e.preventDefault();
      const order=['text','image','fa'];
      const idx=order.indexOf(line.mode);
      line.mode=order[(idx+1)%3];
      // 同步 S
      S.lines[i]=line;
      renderLineTabs();renderStylePanel();draw();
    });
    tab.appendChild(modeSpan);
    // 内容输入
    if(line.mode==='text'){
      const inp=document.createElement('input');inp.type='text';inp.value=line.text||'';inp.placeholder=`第${i+1}行`;

      inp.addEventListener('input',e=>{S.lines[i].text=e.target.value;draw();});

    } else if(line.mode==='fa'){
      const sel=document.createElement('select');sel.className='fa-sel';

        {g:'地点',v:['fa-map-marker']},
        {g:'交通',v:['fa-car','fa-plane','fa-bicycle']},

      sel.addEventListener('change',e=>{S.lines[i].faIcon=e.target.value;draw();});
      tab.appendChild(sel);
    } else { // image
      const lbl=document.createElement('label');lbl.className='btn btn-sm';lbl.style.padding='3px 5px';
      lbl.innerHTML=line.imgUrl?'<i class="fa-solid fa-image"></i>':'<i class="fa-solid fa-cloud-arrow-up"></i>';
      const inp=document.createElement('input');inp.type='file';inp.accept='image/png,image/svg+xml';inp.style.display='none';
      inp.addEventListener('change',e=>{if(e.target.files[0]){const r=new FileReader();r.onload=ev=>{S.lines[i].imgUrl=ev.target.result;draw();lbl.innerHTML='<i class="fa-solid fa-image"></i>';};r.readAsDataURL(e.target.files[0]);}});

    }

      if(e.target===tab){S.currentLine=i;updateLineTabActive();renderStylePanel();$('curLabel').textContent='· 行'+(i+1);}
    });

    tab.addEventListener('click',()=>{S.currentLine=i;updateLineTabActive();renderStylePanel();$('curLabel').textContent='· 行'+(i+1);});

  dz.addEventListener('dragleave',()=>{dz.classList.remove('over');});
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files[0])handle(e.dataTransfer.files[0]);});
  bf.addEventListener('change',e=>{if(e.target.files[0])handle(e.target.files[0]);});
  function handle(f){
    if(!/image\/(png|svg\+xml)/.test(f.type)){alert('仅支持 PNG/SVG');return}
    if(f.size>2*1024*1024){alert('超过2MB');return}
    const r=new FileReader();
    r.onload=ev=>{
      const seg=S.bg.segments[_curSeg];seg.image.url=ev.target.result;
      if(seg.mode!=='image'){document.querySelectorAll('.seg-mode-tab').forEach(x=>x.classList.toggle('active',x.dataset.smode==='image'));seg.mode='image';renderSegEditor();}
      drawSegGrid();draw();
    };r.readAsDataURL(f);
  }
})();

// split layout
$('splitAng').addEventListener('input',e=>{const v=+e.target.value;S.bg.angle=v;$('splitAngV').textContent=v+'°';draw();});
$('splitBd').addEventListener('change',e=>{S.bg.borderShape=e.target.value;draw();});
$('transW').addEventListener('input',e=>{const v=+e.target.value;S.bg.transWidth=v;$('transWV').textContent=v+'px';draw();});
(function(){
  const el=$('transModeGroup');
  [{v:'none',l:'无'},{v:'overlay',l:'叠加'},{v:'darken',l:'加深'},{v:'gradient',l:'渐变'},{v:'lighten',l:'变浅'},{v:'opaque',l:'不透明'},{v:'transparent',l:'透明'}].forEach(({v,l})=>{

    d.onclick=()=>{S.bg.transMode=v;document.querySelectorAll('#transModeGroup .chip').forEach(x=>x.classList.remove('active'));d.classList.add('active');draw();};

// shape controls
$('radius').addEventListener('input',e=>{const v=+e.target.value;S.radius=v;$('radiusV').textContent=v+'%';draw();});

$('borderOn').addEventListener('change',e=>{S.border.on=e.target.checked;$('borderBox').classList.toggle('hidden',!e.target.checked);draw();});
$('borderW').addEventListener('input',e=>{const v=+e.target.value;S.border.w=v;$('borderWV').textContent=v+'px';draw();});
$('borderC').addEventListener('input',e=>{S.border.color=e.target.value;draw();});
$('bgShadowOn').addEventListener('change',e=>{S.bgShadow.on=e.target.checked;$('bgShadowBox').classList.toggle('hidden',!e.target.checked);draw();});
$('bgShB').addEventListener('input',e=>{const v=+e.target.value;S.bgShadow.b=v;$('bgShBV').textContent=v+'px';draw();});
$('bgShX').addEventListener('input',e=>{const v=+e.target.value;S.bgShadow.x=v;$('bgShXV').textContent=v+'px';draw();});
$('bgShY').addEventListener('input',e=>{const v=+e.target.value;S.bgShadow.y=v;$('bgShYV').textContent=v+'px';draw();});
$('bgShC').addEventListener('input',e=>{S.bgShadow.color=e.target.value;draw();});
$('transparentBg').addEventListener('change',e=>{S.transparentBg=e.target.checked;draw();});

// size chips
buildChips('sizeChips',[[16,'16'],[24,'24'],[32,'32'],[48,'48'],[64,'64'],[96,'96'],[128,'128'],[192,'192'],[256,'256'],[512,'512'],[1024,'1024']],'size');

// ═══ PRESETS ═══
const PRESETS=[
  {name:'好', lines:[{mode:'text',text:'好',zhFont:'Noto Sans SC',weight:'700',size:70,color:'#ffeb3b',shadow:{on:false,blur:6,x:0,y:2,color:'#000000'},fillMode:'solid',fillGradS:'#fff',fillGradE:'#fff'}], lineCount:1,layout:'h-center', shape:'polygon',shapeSides:4,shapeStar:false,radius:35,shapeAngle:0, bg:{numSegs:1,segments:[{mode:'solid',solid:'#c14749',gradient:{start:'#c14749',end:'#c14749',type:'linear',angle:135},image:{url:null,scale:100,pos:'center'}}],angle:0,ratios:[],borderShape:'line',transMode:'none',transWidth:0}},
  {name:'★', lines:[{mode:'fa',text:'★',faIcon:'fa-star',faColor:'#f4a261',faSize:80,shadow:{on:true,blur:10,x:0,y:3,color:'#000000'}}], lineCount:1,layout:'h-center', shape:'polygon',shapeSides:5,shapeStar:true,radius:0,shapeAngle:0, bg:{numSegs:1,segments:[{mode:'gradient',solid:'#1a1a2e',gradient:{start:'#1a1a2e',end:'#2d3a4a',type:'linear',angle:135},image:{url:null,scale:100,pos:'center'}}],angle:0,ratios:[],borderShape:'line',transMode:'none',transWidth:0}},
  {name:'S+D', lines:[{mode:'text',text:'S',weight:'700',size:50,color:'#fff',shadow:{on:false,blur:6,x:0,y:2,color:'#000000'},fillMode:'solid',fillGradS:'#fff',fillGradE:'#fff'},{mode:'text',text:'D',weight:'700',size:50,color:'#fff',shadow:{on:false,blur:6,x:0,y:2,color:'#000000'},fillMode:'solid',fillGradS:'#fff',fillGradE:'#fff'}], lineCount:2,layout:'v-top-bot', shape:'polygon',shapeSides:4,shapeStar:false,radius:100,shapeAngle:0, bg:{numSegs:1,segments:[{mode:'gradient',solid:'#667eea',gradient:{start:'#667eea',end:'#764ba2',type:'linear',angle:135},image:{url:null,scale:100,pos:'center'}}],angle:0,ratios:[],borderShape:'line',transMode:'none',transWidth:0}},
  {name:'福/气/来', lines:[{mode:'text',text:'福',zhFont:'Noto Sans SC',weight:'700',size:42,color:'#fff',shadow:{on:false,blur:6,x:0,y:2,color:'#000000'},fillMode:'solid',fillGradS:'#fff',fillGradE:'#fff'},{mode:'text',text:'气',zhFont:'Noto Sans SC',weight:'700',size:42,color:'#fff',shadow:{on:false,blur:6,x:0,y:2,color:'#000000'},fillMode:'solid',fillGradS:'#fff',fillGradE:'#fff'},{mode:'text',text:'来',zhFont:'Noto Sans SC',weight:'700',size:42,color:'#fff',shadow:{on:false,blur:6,x:0,y:2,color:'#000000'},fillMode:'solid',fillGradS:'#fff',fillGradE:'#fff'}], lineCount:3,layout:'t-default', shape:'polygon',shapeSides:4,shapeStar:false,radius:0,shapeAngle:45, bg:{numSegs:1,segments:[{mode:'solid',solid:'#d94f4f',gradient:{start:'#d94f4f',end:'#d94f4f',type:'linear',angle:135},image:{url:null,scale:100,pos:'center'}}],angle:0,ratios:[],borderShape:'line',transMode:'none',transWidth:0}},
  {name:'星/圆', lines:[{mode:'fa',text:'○',faIcon:'fa-circle',faColor:'#fff',faSize:70,shadow:{on:false,blur:6,x:0,y:2,color:'#000000'}}], lineCount:1,layout:'h-center', shape:'circle',shapeSides:0,shapeStar:false,radius:0,shapeAngle:0, bg:{numSegs:2,segments:[{mode:'solid',solid:'#e76f51',gradient:{start:'#e76f51',end:'#e76f51',type:'linear',angle:135},image:{url:null,scale:100,pos:'center'}},{mode:'solid',solid:'#2a9d8f',gradient:{start:'#2a9d8f',end:'#2a9d8f',type:'linear',angle:135},image:{url:null,scale:100,pos:'center'}}],angle:45,ratios:[50],borderShape:'line',transMode:'none',transWidth:0}},
  {name:'飞', lines:[{mode:'text',text:'飞',zhFont:'Noto Sans SC',weight:'700',size:65,color:'#ffcc00',shadow:{on:false,blur:6,x:0,y:2,color:'#000000'},fillMode:'solid',fillGradS:'#fff',fillGradE:'#fff'}], lineCount:1,layout:'h-center', shape:'rect',shapeSides:0,shapeStar:false,radius:0,shapeAngle:0, bg:{numSegs:1,segments:[{mode:'solid',solid:'#111111',gradient:{start:'#111111',end:'#111111',type:'linear',angle:135},image:{url:null,scale:100,pos:'center'}}],angle:0,ratios:[],borderShape:'line',transMode:'none',transWidth:0}}
];
function applyPreset(p){
  S=JSON.parse(JSON.stringify(DEFAULTS));
  S.lines=JSON.parse(JSON.stringify(p.lines));
  S.lineCount=p.lineCount;S.layout=p.layout;
  S.shape=p.shape||'polygon';
  if(p.shapeSides!==undefined)S.shapeSides=p.shapeSides;
  if(p.shapeStar!==undefined)S.shapeStar=p.shapeStar;
  S.radius=p.radius!==undefined?p.radius:0;
  if(p.shapeAngle!==undefined)S.shapeAngle=p.shapeAngle;
  S.bg=JSON.parse(JSON.stringify(p.bg));
  S.currentLine=0;
  renderAll();draw();
  if(window.IK)window.IK.S=S;
}
const presetCanvases=[];
function drawPresets(){
  const pr=$('presetRow');
  if(pr.childElementCount!==PRESETS.length){
    pr.innerHTML='';
    PRESETS.forEach((p,idx)=>{
      const el=document.createElement('div');el.className='preset';el.title=p.name;
      const c=document.createElement('canvas');c.width=64;c.height=64;
      el.appendChild(c);
      el.onclick=()=>{applyPreset(p);document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));el.classList.add('active');};
      pr.appendChild(el);presetCanvases[idx]={el,c,cx:c.getContext('2d')};
    });
  }
  PRESETS.forEach((p,idx)=>{
    const{cx}=presetCanvases[idx];
    const saved=JSON.parse(JSON.stringify(S));
    S=JSON.parse(JSON.stringify(DEFAULTS));
    S.lines=JSON.parse(JSON.stringify(p.lines));
    S.lineCount=p.lineCount;S.layout=p.layout;S.shape=p.shape||'polygon';
    if(p.shapeSides!==undefined)S.shapeSides=p.shapeSides;
    if(p.shapeStar!==undefined)S.shapeStar=p.shapeStar;
    S.radius=p.radius!==undefined?p.radius:0;
    if(p.shapeAngle!==undefined)S.shapeAngle=p.shapeAngle;
    S.bg=JSON.parse(JSON.stringify(p.bg));
    draw(cx,64);
    S=saved;
  });
}

function renderAll(){
  buildChips('sizeChips',[[16,'16'],[24,'24'],[32,'32'],[48,'48'],[64,'64'],[96,'96'],[128,'128'],[192,'192'],[256,'256'],[512,'512'],[1024,'1024']],'size');
  buildShapeChips();updateShapeToggles();
  renderLineCount();renderLineTabs();renderLayoutGroup();
  ensureSegs(S.bg.numSegs);
  document.querySelectorAll('.fill-tab').forEach(x=>x.classList.toggle('active',+x.dataset.segn===S.bg.numSegs));
  drawSegGrid();renderSegEditor();
  renderStyleTabs();renderStylePanel();$('curLabel').textContent='· 行'+(S.currentLine+1);
  $('radius').value=S.radius;$('radiusV').textContent=S.radius+'%';
  $('shapeAngle').value=S.shapeAngle||0;$('shapeAngleV').textContent=(S.shapeAngle||0)+'°';
  $('splitAng').value=S.bg.angle;$('splitAngV').textContent=S.bg.angle+'°';
  $('borderOn').checked=S.border.on;$('borderBox').classList.toggle('hidden',!S.border.on);
  $('borderW').value=S.border.w;$('borderWV').textContent=S.border.w+'px';$('borderC').value=S.border.color;
  $('bgShadowOn').checked=S.bgShadow.on;$('bgShadowBox').classList.toggle('hidden',!S.bgShadow.on);
  $('bgShB').value=S.bgShadow.b;$('bgShBV').textContent=S.bgShadow.b+'px';$('bgShX').value=S.bgShadow.x;$('bgShXV').textContent=S.bgShadow.x+'px';
  $('bgShY').value=S.bgShadow.y;$('bgShYV').textContent=S.bgShadow.y+'px';$('bgShC').value=S.bgShadow.color;
  $('transparentBg').checked=S.transparentBg;
  $('splitBd').value=S.bg.borderShape;$('transW').value=S.bg.transWidth;$('transWV').textContent=S.bg.transWidth+'px';
}

// DOWNLOAD
function exportName(ext){
  const size=S.size;
  const l0=(S.lines[0]&&S.lines[0].text)?S.lines[0].text.replace(/[\\/:*?"<>|]/g,'-').slice(0,20):(S.lines[0]&&S.lines[0].faIcon)?(S.lines[0].faIcon.slice(3)):'icon';
  const d=new Date();const pad=n=>String(n).padStart(2,'0');
  const ts=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  return `IconKing-${size}-${l0}-${ts}.${ext}`;
}
$('dlPng').onclick=()=>{draw();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=exportName('png');a.click();};
$('dlJpg').onclick=()=>{draw();const a=document.createElement('a');a.href=canvas.toDataURL('image/jpeg',0.92);a.download=exportName('jpg');a.click();};
$('dlSvg').onclick=()=>{draw();const s=S.size;const b=new Blob([`<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><rect width="100%" height="100%" fill="${S.bg.segments[0].solid}"/><text x="${s/2}" y="${s/2}" text-anchor="middle" dominant-baseline="middle" font-family="Inter,Noto Sans SC" font-size="${s*(S.lines[0].size||65)/100}" font-weight="${S.lines[0].weight||700}" fill="${S.lines[0].color||'#fff'}">${S.lines[0].text||''}</text></svg>`],{type:'image/svg+xml'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=exportName('svg');a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
$('btnReset').onclick=()=>{S=JSON.parse(JSON.stringify(DEFAULTS));renderAll();draw();drawPresets();document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));};

// THEME
document.querySelectorAll('.theme-btn').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.theme-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.documentElement.dataset.theme=b.dataset.t;S.theme=b.dataset.t;};
});

// INIT
document.documentElement.dataset.theme=S.theme;
// INIT：三重保险 —— 三个地方都尝试 renderAll+draw
const _initDraw = ()=>{try{renderAll();draw();}catch(e){console.error('init chain err:',e);try{draw();}catch(e2){}}};
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(_initDraw);}
else{_initDraw();}
window.addEventListener('load',()=>{setTimeout(_initDraw,400);});
window.addEventListener('load',()=>{setTimeout(()=>{try{drawPresets();}catch(e){console.error('drawPresets err:',e);}},500);});
window.IK={S,draw,DEFAULTS,applyPreset,drawPresets};
})();
</script>
